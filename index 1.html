<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haushaltsplan</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#1b2430;--mute:#647081;--line:#d9dee5;--acc:#2b5d8a;--accs:#dce7f2;--red:#cf3e4f;--green:#2e9a57;--grey:#b9c0ca;--chip:#e3e8ee;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#12161b;--card:#1b2128;--ink:#e8edf2;--mute:#97a3b1;--line:#2c343e;--acc:#7fb2e0;--accs:#22344a;--red:#ef6878;--green:#56c47f;--grey:#48525e;--chip:#252d36}}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
h2{font-size:17px;margin:22px 0 8px}
h3{font-size:15px;margin:0}
.status{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--grey);display:inline-block}
.status.ok i{background:var(--green)}.status.err i{background:var(--red)}
.tabs{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;font-weight:600;color:var(--mute)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;-webkit-overflow-scrolling:touch}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.muted{color:var(--mute)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.del{color:var(--red)}
.icon{border:0;background:none;padding:6px 10px;font-size:18px;color:var(--mute)}
.icon:disabled{opacity:.3}
.cal{width:100%;border-collapse:separate;border-spacing:0 3px;table-layout:fixed}
.cal th{font-size:11px;color:var(--mute);font-weight:600;padding:2px 0}
.cal td{text-align:center;padding:6px 0;font-size:14px}
.cal tr.wk{cursor:pointer}
.cal tr.wk.sel td{background:var(--accs)}
.cal tr.wk.sel td:first-child{border-radius:10px 0 0 10px}.cal tr.wk.sel td:last-child{border-radius:0 10px 10px 0}
.cal td.out{color:var(--grey)}
.cal td.today span{outline:2px solid var(--acc);border-radius:50%;padding:2px 5px}
.kw{font-size:11px;font-weight:700;border-radius:8px;padding:5px 0;display:block;margin:0 3px;color:var(--mute);background:var(--chip)}
.kw.open{background:var(--red);color:#fff}.kw.done{background:var(--green);color:#fff}
.kdots{display:flex;justify-content:center;gap:3px;margin-top:3px}
.kdots i{width:7px;height:7px;border-radius:50%;background:var(--grey)}
.kdots i.open{background:var(--red)}.kdots i.done{background:var(--green)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:6px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.badge{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;color:#fff}
.badge.open{background:var(--red)}.badge.done{background:var(--green)}.badge.future{background:var(--grey)}
.task{border-top:1px solid var(--line);padding:9px 0}
.chk{width:28px;height:28px;border-radius:8px;border:2px solid var(--grey);background:none;flex:none;display:grid;place-items:center;font-size:16px;color:#fff;padding:0}
.chk.on{background:var(--green);border-color:var(--green)}
.done-t{text-decoration:line-through;color:var(--mute)}
.days{display:flex;gap:5px;margin:7px 0 0 36px;flex-wrap:wrap}
.days button{width:34px;height:30px;border-radius:7px;border:1.5px solid var(--grey);background:none;font-size:12px;padding:0}
.days button.on{background:var(--green);border-color:var(--green);color:#fff}
details{margin:5px 0 0 36px}
summary{font-size:13px;color:var(--acc);cursor:pointer}
details ul{margin:6px 0 0;padding-left:20px;font-size:14px}
.bar{display:grid;grid-template-columns:84px 1fr 86px;align-items:center;gap:8px;margin:7px 0;font-size:14px}
.bar .tr{height:14px;background:var(--chip);border-radius:7px;overflow:hidden}
.bar .tr b{display:block;height:100%;border-radius:7px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
table.hist{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.hist th,table.hist td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.hist th:first-child,table.hist td:first-child{text-align:left}
.ti{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:10px 0}
.ti:first-child{border-top:0}
label.f{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-size:16px}
.steps .row{margin-bottom:6px}
.pool{font-size:11px;font-weight:600;background:var(--accs);color:var(--acc);border-radius:999px;padding:2px 8px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
 <header><h1>Haushaltsplan</h1><div id="st" class="status"><i></i><span>Verbinde…</span></div></header>
 <div id="app"><p class="muted">Lade…</p></div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyAySkjUJKdug-upeiQxYIjKnjcv_H6DKiM",authDomain:"haushalt-bf7a1.firebaseapp.com",projectId:"haushalt-bf7a1",storageBucket:"haushalt-bf7a1.firebasestorage.app",messagingSenderId:"119943513849",appId:"1:119943513849:web:d75866dde66e2b5610c428"};

const INTERVALS=[['daily','täglich',1],['weekly','wöchentlich',1],['biweekly','alle 2 Wochen',2],['3weekly','alle 3 Wochen',3],['monthly','monatlich (alle 4 Wochen)',4],['quarterly','vierteljährlich (alle 13 Wochen)',13]];
const IV={};INTERVALS.forEach(x=>IV[x[0]]={label:x[1],n:x[2]});
const COLORS=['#2b5d8a','#c0563f','#2e8a5a','#8456b0','#c28a1e','#21918f','#b5487a','#5b6b7a'];
const WD=['Mo','Di','Mi','Do','Fr','Sa','So'];
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const DAY=864e5;

function T(id,name,min,iv,person,off,steps){return{id,name,min,iv,person,off,steps}}
const BAD=['Spiegel putzen','Waschbecken und Armatur reinigen','Toilette putzen','Dusche/Wanne reinigen','Boden wischen'];
const SEED={start:'2026-10-05',
 people:[{id:'bernd',name:'Bernd',color:COLORS[0]},{id:'qingxia',name:'Qingxia',color:COLORS[1]},{id:'sebastian',name:'Sebastian',color:COLORS[2]},{id:'linda',name:'Linda',color:COLORS[3]}],
 tasks:[
  T('staubstart','Staubsauger starten',5,'daily','bernd',0,[]),
  T('staubob','Staubsauger oben',15,'weekly','bernd',0,[]),
  T('staubun','Staubsauger unten',15,'weekly','bernd',0,[]),
  T('muell','Mülltonnen',5,'weekly','bernd',0,[]),
  T('filter','Wasserfilter reinigen',10,'monthly','bernd',1,[]),
  T('waesche','Wäsche waschen',60,'weekly','qingxia',0,[]),
  T('treppe','Treppe putzen',30,'weekly','',0,['Treppe saugen','Stufen feucht wischen','Geländer abwischen']),
  T('badoben','Bad oben',30,'weekly','',0,BAD.slice()),
  T('badmitte','Bad Mitte',15,'weekly','',0,BAD.slice()),
  T('badunten','Bad unten',30,'3weekly','',0,BAD.slice()),
  T('kueche','Küche putzen',30,'biweekly','',0,['Arbeitsflächen abwischen','Herd und Spüle reinigen','Fronten abwischen','Boden wischen']),
  T('mittewisch','Mitte wischen',60,'monthly','',2,[]),
  T('pflanzen','Pflanzen gießen',10,'weekly','',0,[])
 ]};

let db=null,plan=null,checks={},assignCache=null,edit=null,tab='week',sel='all',curWeek=0,viewMonth=null,planLoaded=false,nameOf={};
try{tab=localStorage.getItem('hh_tab')||'week';sel=localStorage.getItem('hh_sel')||'all'}catch(e){}
function persist(){try{localStorage.setItem('hh_tab',tab);localStorage.setItem('hh_sel',sel)}catch(e){}}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseD(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function startMon(){return mondayOf(parseD(plan.start))}
function weekIdx(d){return Math.round((mondayOf(d)-startMon())/(7*DAY))}
function weekMon(i){const s=startMon();return new Date(s.getFullYear(),s.getMonth(),s.getDate()+7*i)}
function wid(i){return 'w'+iso(weekMon(i)).replace(/-/g,'')}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/DAY+1)/7)}
function fmtMin(m){m=Math.round(m);if(m<60)return m+' Min';const h=Math.floor(m/60),r=m%60;return h+' Std'+(r?' '+r+' Min':'')}
function fmtDate(d){return d.getDate()+'.'+(d.getMonth()+1)+'.'}
function person(id){return plan.people.find(p=>p.id===id)}
function nowWeek(){return weekIdx(new Date())}

/* Verteilung: feste Aufgaben direkt, Pool-Aufgaben an die Person mit der bisher geringsten Gesamtzeit */
function due(t,i){if(i<0)return false;const n=(IV[t.iv]||IV.weekly).n;return(((i-(t.off||0))%n)+n)%n===0}
function weekMin(t){return t.iv==='daily'?t.min*7:t.min}
function assign(i){
 if(i<0||i>5200||!plan.people.length)return[];
 const ppl=plan.people,ids=new Set(ppl.map(p=>p.id));
 if(!assignCache){assignCache={weeks:[],load:{}};ppl.forEach(p=>assignCache.load[p.id]=0)}
 const C=assignCache;
 while(C.weeks.length<=i){
  const w=C.weeks.length,list=[],tasks=plan.tasks.filter(t=>due(t,w));
  tasks.forEach(t=>{if(t.person&&ids.has(t.person)){list.push({t,p:t.person});C.load[t.person]+=weekMin(t)}});
  const pool=tasks.filter(t=>!(t.person&&ids.has(t.person))).sort((a,b)=>weekMin(b)-weekMin(a)||a.id.localeCompare(b.id));
  pool.forEach(t=>{let best=null,bv=Infinity;for(let k=0;k<ppl.length;k++){const p=ppl[(k+w)%ppl.length].id;if(C.load[p]<bv-1e-9){bv=C.load[p];best=p}}list.push({t,p:best});C.load[best]+=weekMin(t)});
  C.weeks.push(list);
 }
 return C.weeks[i];
}
function keysFor(t){return t.iv==='daily'?[0,1,2,3,4,5,6].map(d=>t.id+'_'+d):[t.id]}
function rec(i,k){const v=(checks[wid(i)]||{})[k];return v&&typeof v==='object'?v:null}
function status(i,p){
 const a=assign(i).filter(x=>x.p===p);if(!a.length)return null;
 if(a.every(x=>keysFor(x.t).every(k=>rec(i,k))))return 'done';
 return i>nowWeek()?'future':'open';
}

/* Speichern */
function setStatus(c,txt){const s=$('#st');s.className='status '+c;s.querySelector('span').textContent=txt}
function savePlan(){
 assignCache=null;render();
 db.collection('config').doc('plan').set(JSON.parse(JSON.stringify(plan))).then(()=>setStatus('ok','Für alle synchronisiert')).catch(e=>{console.error(e);setStatus('err','Speichern fehlgeschlagen – Regeln prüfen')});
}
function toggle(i,t,p,k){
 const id=wid(i),on=!!rec(i,k);checks[id]=checks[id]||{};
 let val;
 if(on){delete checks[id][k];val=firebase.firestore.FieldValue.delete()}
 else{val={p,pn:(person(p)||{}).name||'',m:t.min,n:t.name,t:iso(new Date())};checks[id][k]=val}
 render();
 db.collection('checks').doc(id).set({[k]:val},{merge:true}).catch(e=>{console.error(e);setStatus('err','Speichern fehlgeschlagen – Regeln prüfen')});
}

/* Ansicht */
function render(){
 const app=$('#app');
 if(!plan){app.innerHTML='<p class="muted">Lade…</p>';return}
 if(sel!=='all'&&!person(sel))sel='all';
 let h=`<div class="tabs">${[['week','Woche'],['stats','Auswertung'],['edit','Bearbeiten']].map(([k,l])=>`<button data-a="tab" data-v="${k}" class="${tab===k?'on':''}">${l}</button>`).join('')}</div>`;
 h+= tab==='week'?viewWeek():tab==='stats'?viewStats():viewEdit();
 app.innerHTML=h;
}
function chips(){
 return `<div class="chips"><button class="chip ${sel==='all'?'on':''}" data-a="sel" data-v="all">Alle</button>${plan.people.map(p=>`<button class="chip ${sel===p.id?'on':''}" data-a="sel" data-v="${p.id}"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</button>`).join('')}</div>`;
}
function viewWeek(){
 let h=chips();
 const y=viewMonth.getFullYear(),m=viewMonth.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0);
 let d=mondayOf(first);const today=iso(new Date());
 h+=`<div class="box"><div class="row"><button class="icon" data-a="mon" data-v="-1" aria-label="Vormonat">‹</button><h3 class="sp" style="text-align:center">${MONTHS[m]} ${y}</h3><button class="icon" data-a="mon" data-v="1" aria-label="Nächster Monat">›</button></div>`;
 h+=`<table class="cal"><tr><th>KW</th>${WD.map(x=>`<th>${x}</th>`).join('')}</tr>`;
 while(d<=last){
  const i=weekIdx(d);let kw;
  if(sel!=='all'){const s=status(i,sel);kw=`<span class="kw ${s||''}">${isoWeek(d)}</span>`}
  else{kw=`<span class="kw">${isoWeek(d)}</span><span class="kdots">${plan.people.map(p=>{const s=status(i,p.id);return s?`<i class="${s}" title="${esc(p.name)}"></i>`:''}).join('')}</span>`}
  h+=`<tr class="wk ${i===curWeek?'sel':''}" data-a="week" data-v="${i}"><td>${kw}</td>`;
  for(let k=0;k<7;k++){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+k);h+=`<td class="${x.getMonth()!==m?'out':''} ${iso(x)===today?'today':''}"><span>${x.getDate()}</span></td>`}
  h+='</tr>';d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+7);
 }
 h+=`</table><div class="legend"><span><i class="dot" style="background:var(--green)"></i>alles erledigt</span><span><i class="dot" style="background:var(--red)"></i>noch offen</span><span><i class="dot" style="background:var(--grey)"></i>kommt noch</span></div></div>`;
 const i=curWeek,mon=weekMon(i),sun=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+6);
 h+=`<div class="row" style="margin-top:16px"><button class="icon" data-a="wk" data-v="-1" aria-label="Vorwoche">‹</button><div class="sp" style="text-align:center"><b>KW ${isoWeek(mon)}</b> <span class="muted small">${fmtDate(mon)} – ${fmtDate(sun)}${sun.getFullYear()}</span></div><button class="icon" data-a="wk" data-v="1" aria-label="Nächste Woche">›</button></div>`;
 if(i!==nowWeek())h+=`<div style="text-align:center"><button class="btn small" data-a="today">Zur aktuellen Woche</button></div>`;
 if(i<0){const s=parseD(plan.start);return h+`<div class="box muted">Der Plan startet am ${fmtDate(s)}${s.getFullYear()}.</div>`}
 const a=assign(i),ppl=plan.people.filter(p=>sel==='all'||p.id===sel);
 ppl.forEach(p=>{
  const mine=a.filter(x=>x.p===p.id),s=status(i,p.id),tot=mine.reduce((n,x)=>n+weekMin(x.t),0);
  h+=`<div class="box"><div class="ph"><span class="dot" style="background:${p.color}"></span><h3>${esc(p.name)}</h3><span class="muted small">${fmtMin(tot)}</span><span class="sp"></span>${s?`<span class="badge ${s}">${s==='done'?'erledigt':s==='open'?'offen':'kommt noch'}</span>`:''}</div>`;
  if(!mine.length)h+=`<div class="muted small">Diese Woche nichts zu tun.</div>`;
  mine.forEach(({t})=>{
   const daily=t.iv==='daily',ok=keysFor(t).every(k=>rec(i,k));
   h+=`<div class="task"><div class="row">`;
   h+=daily?`<span class="chk ${ok?'on':''}" aria-hidden="true">${ok?'✓':''}</span>`:`<button class="chk ${ok?'on':''}" data-a="chk" data-w="${i}" data-t="${t.id}" data-p="${p.id}" data-k="${t.id}" aria-label="${esc(t.name)} erledigt">${ok?'✓':''}</button>`;
   h+=`<span class="sp ${ok?'done-t':''}">${esc(t.name)}</span><span class="muted small">${daily?t.min+' Min/Tag':t.min+' Min'}</span></div>`;
   if(daily)h+=`<div class="days">${WD.map((w,k)=>`<button class="${rec(i,t.id+'_'+k)?'on':''}" data-a="chk" data-w="${i}" data-t="${t.id}" data-p="${p.id}" data-k="${t.id}_${k}">${w}</button>`).join('')}</div>`;
   if(t.steps&&t.steps.length)h+=`<details><summary>Was ist zu tun?</summary><ul>${t.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>`;
   h+=`</div>`;
  });
  h+=`</div>`;
 });
 return h;
}
function pname(id){const p=person(id);return p?p.name:(nameOf[id]||'(entfernt)')}
function bars(vals,ids){
 const max=Math.max(1,...ids.map(id=>vals[id]||0));
 return ids.map(id=>{const p=person(id),c=p?p.color:'var(--grey)',v=vals[id]||0;return `<div class="bar"><span>${esc(pname(id))}</span><span class="tr"><b style="width:${v/max*100}%;background:${c}"></b></span><span class="v">${fmtMin(v)}</span></div>`}).join('');
}
function viewStats(){
 const from=Math.max(0,nowWeek()),N=52,pl={};plan.people.forEach(p=>pl[p.id]=0);
 for(let i=from;i<from+N;i++)assign(i).forEach(x=>{pl[x.p]+=weekMin(x.t)/N});
 const avg=plan.people.length?Object.values(pl).reduce((a,b)=>a+b,0)/plan.people.length:0;
 let h=`<h2>Geplante Arbeit</h2><div class="box"><div class="muted small">Durchschnitt pro Woche über die nächsten 52 Wochen. Schnitt aller: ${fmtMin(avg)}</div>${bars(pl,plan.people.map(p=>p.id))}</div>`;
 const tot={},mon={};nameOf={};
 Object.values(checks).forEach(doc=>Object.values(doc||{}).forEach(v=>{
  if(!v||typeof v!=='object'||!v.p)return;
  const mm=+v.m||0,mk=String(v.t||'').slice(0,7);if(v.pn)nameOf[v.p]=v.pn;
  tot[v.p]=(tot[v.p]||0)+mm;(mon[mk]=mon[mk]||{})[v.p]=(mon[mk][v.p]||0)+mm;
 }));
 const ids=plan.people.map(p=>p.id);Object.keys(tot).forEach(id=>{if(!ids.includes(id))ids.push(id)});
 const now=new Date(),curKey=iso(now).slice(0,7);
 h+=`<h2>Erledigt im ${MONTHS[now.getMonth()]}</h2><div class="box">${bars(mon[curKey]||{},ids)}</div>`;
 h+=`<h2>Erledigt insgesamt</h2><div class="box">${bars(tot,ids)}</div>`;
 const keys=Object.keys(mon).filter(Boolean).sort().reverse();
 h+=`<h2>Monatsverlauf</h2><div class="box">`;
 if(!keys.length)h+=`<div class="muted small">Sobald Aufgaben abgehakt werden, erscheint hier jeder Monat.</div>`;
 else{
  h+=`<div class="tw"><table class="hist"><tr><th>Monat</th>${ids.map(id=>`<th>${esc(pname(id))}</th>`).join('')}</tr>`;
  keys.forEach(k=>{const[yy,mm]=k.split('-');h+=`<tr><td>${MONTHS[+mm-1]} ${yy}</td>${ids.map(id=>`<td>${mon[k][id]?fmtMin(mon[k][id]):'–'}</td>`).join('')}</tr>`});
  h+=`</table></div>`;
 }
 return h+`</div><p class="muted small">Gezählt wird beim Abhaken: Die Minuten gehen an die zuständige Person, im Monat des Abhakens. Tägliche Aufgaben zählen pro Tag.</p>`;
}
function whoLabel(t){return t.person&&person(t.person)?`<span class="small">${esc(person(t.person).name)}</span>`:'<span class="pool">Pool</span>'}
function viewEdit(){
 if(edit)return viewEditor();
 let h=`<h2>Aufgaben</h2><div class="box">`;
 plan.tasks.forEach(t=>{h+=`<div class="ti"><div class="sp"><b>${esc(t.name)}</b><div class="muted small">${t.min} Min, ${(IV[t.iv]||IV.weekly).label}${t.steps&&t.steps.length?', '+t.steps.length+' Schritte':''}</div></div>${whoLabel(t)}<button class="btn" data-a="edit" data-v="${t.id}">Ändern</button></div>`});
 if(!plan.tasks.length)h+=`<div class="muted">Noch keine Aufgaben. Leg die erste an.</div>`;
 h+=`</div><div style="margin-top:10px"><button class="btn pri" data-a="new">Neue Aufgabe</button></div>`;
 h+=`<h2>Personen</h2><div class="box">`;
 plan.people.forEach(p=>{h+=`<div class="ti"><span class="dot" style="background:${p.color}"></span><b class="sp">${esc(p.name)}</b><button class="btn" data-a="pren" data-v="${p.id}">Umbenennen</button><button class="btn del" data-a="pdel" data-v="${p.id}">Entfernen</button></div>`});
 h+=`<div class="row" style="margin-top:10px"><input id="pName" class="inp" placeholder="Name der neuen Person" autocomplete="off"><button class="btn pri" data-a="padd">Hinzufügen</button></div></div>`;
 h+=`<h2>Planstart</h2><div class="box"><div class="muted small">Woche 1 beginnt am Montag dieser Woche. Pool-Aufgaben werden ab hier fair nach Minuten verteilt.</div><input id="startIn" type="date" class="inp" style="margin-top:8px" value="${esc(plan.start)}"></div>`;
 return h;
}
function viewEditor(){
 const t=edit;
 let h=`<h2>${t._new?'Neue Aufgabe':'Aufgabe ändern'}</h2><div class="box">`;
 h+=`<label class="f" for="fName">Name</label><input id="fName" class="inp" value="${esc(t.name)}" autocomplete="off">`;
 h+=`<label class="f" for="fMin">Dauer je Mal (Minuten)</label><input id="fMin" class="inp" type="number" inputmode="numeric" min="1" value="${t.min||''}">`;
 h+=`<label class="f" for="fIv">Intervall</label><select id="fIv" class="inp">${INTERVALS.map(([k,l])=>`<option value="${k}" ${t.iv===k?'selected':''}>${l}</option>`).join('')}</select>`;
 h+=`<label class="f" for="fWho">Zuständig</label><select id="fWho" class="inp"><option value="">Pool – fair auf alle verteilt</option>${plan.people.map(p=>`<option value="${p.id}" ${t.person===p.id?'selected':''}>Fest: ${esc(p.name)}</option>`).join('')}</select>`;
 h+=`<label class="f">Was ist zu tun?</label><div class="steps">${t.steps.map((s,k)=>`<div class="row"><input class="inp step" data-i="${k}" value="${esc(s)}"><button class="icon" data-a="stepUp" data-v="${k}" aria-label="Nach oben" ${k?'':'disabled'}>↑</button><button class="icon" data-a="stepDel" data-v="${k}" aria-label="Schritt löschen">✕</button></div>`).join('')}</div>`;
 h+=`<div class="row"><input id="fStep" class="inp" placeholder="Neuer Schritt, z. B. Spiegel putzen" autocomplete="off"><button class="btn" data-a="stepAdd">Hinzufügen</button></div>`;
 h+=`<div class="row" style="margin-top:18px"><button class="btn pri" data-a="save">Speichern</button><button class="btn" data-a="cancel">Abbrechen</button><span class="sp"></span>${t._new?'':'<button class="btn del" data-a="del">Löschen</button>'}</div></div>`;
 return h;
}
function readForm(){
 if(!edit||!$('#fName'))return;
 edit.name=$('#fName').value.trim();edit.min=+$('#fMin').value||0;edit.iv=$('#fIv').value;edit.person=$('#fWho').value;
 document.querySelectorAll('.step').forEach(el=>{edit.steps[+el.dataset.i]=el.value});
}
function addStep(){readForm();const v=$('#fStep').value.trim();if(v){edit.steps.push(v);render();setTimeout(()=>{const f=$('#fStep');if(f)f.focus()},0)}}

/* Aktionen */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
 const a=el.dataset.a,v=el.dataset.v;
 if(a==='tab'){if(edit&&v!=='edit')edit=null;tab=v;persist();render();window.scrollTo(0,0)}
 else if(a==='sel'){sel=v;persist();render()}
 else if(a==='mon'){viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+(+v),1);render()}
 else if(a==='week'){curWeek=+v;render()}
 else if(a==='wk'){curWeek+=+v;const mo=weekMon(curWeek);viewMonth=new Date(mo.getFullYear(),mo.getMonth(),1);render()}
 else if(a==='today'){curWeek=nowWeek();const n=new Date();viewMonth=new Date(n.getFullYear(),n.getMonth(),1);render()}
 else if(a==='chk'){const t=plan.tasks.find(x=>x.id===el.dataset.t);if(t)toggle(+el.dataset.w,t,el.dataset.p,el.dataset.k)}
 else if(a==='new'){edit={_new:true,id:'t'+Date.now().toString(36),name:'',min:15,iv:'weekly',person:'',off:0,steps:[]};render();window.scrollTo(0,0)}
 else if(a==='edit'){const t=plan.tasks.find(x=>x.id===v);if(t){edit=JSON.parse(JSON.stringify(t));edit.steps=edit.steps||[];render();window.scrollTo(0,0)}}
 else if(a==='cancel'){edit=null;render()}
 else if(a==='stepAdd')addStep();
 else if(a==='stepDel'){readForm();edit.steps.splice(+v,1);render()}
 else if(a==='stepUp'){readForm();const k=+v;[edit.steps[k-1],edit.steps[k]]=[edit.steps[k],edit.steps[k-1]];render()}
 else if(a==='save'){
  readForm();if(!edit.name){alert('Bitte einen Namen eingeben.');return}if(!(edit.min>0)){alert('Bitte eine Dauer in Minuten eingeben.');return}
  const n=(IV[edit.iv]||IV.weekly).n;
  const t={id:edit.id,name:edit.name,min:edit.min,iv:edit.iv,person:edit.person,off:edit._new?Math.floor(Math.random()*n):(edit.off||0)%n,steps:edit.steps.map(s=>s.trim()).filter(Boolean)};
  const k=plan.tasks.findIndex(x=>x.id===t.id);if(k>=0)plan.tasks[k]=t;else plan.tasks.push(t);
  edit=null;savePlan();
 }
 else if(a==='del'){if(confirm('Aufgabe „'+edit.name+'“ löschen? Bereits erledigte Minuten bleiben in der Auswertung.')){plan.tasks=plan.tasks.filter(x=>x.id!==edit.id);edit=null;savePlan()}}
 else if(a==='padd'){
  const nm=$('#pName').value.trim();if(!nm)return;
  const used=plan.people.map(p=>p.color),color=COLORS.find(c=>!used.includes(c))||COLORS[plan.people.length%COLORS.length];
  plan.people.push({id:'p'+Date.now().toString(36),name:nm,color});savePlan();
 }
 else if(a==='pren'){const p=person(v);const nm=prompt('Neuer Name:',p.name);if(nm&&nm.trim()){p.name=nm.trim();savePlan()}}
 else if(a==='pdel'){
  const p=person(v),fix=plan.tasks.filter(t=>t.person===v);
  if(confirm(p.name+' entfernen?'+(fix.length?'\n'+fix.length+' feste Aufgabe(n) kommen in den Pool.':'')+'\nErledigte Minuten bleiben in der Auswertung.')){
   fix.forEach(t=>{t.person=''});plan.people=plan.people.filter(x=>x.id!==v);if(sel===v)sel='all';savePlan();
  }
 }
});
document.addEventListener('keydown',e=>{
 if(e.key!=='Enter')return;
 if(e.target.id==='fStep'){e.preventDefault();addStep()}
 if(e.target.id==='pName'){e.preventDefault();$('[data-a="padd"]').click()}
});
document.addEventListener('change',e=>{
 if(e.target.id==='startIn'&&e.target.value){plan.start=e.target.value;assignCache=null;curWeek=nowWeek();savePlan()}
});

/* Start */
function softRender(){if(tab==='edit'&&(edit||(document.activeElement&&document.activeElement.id==='pName')))return;render()}
function init(){curWeek=nowWeek();const n=new Date();viewMonth=new Date(n.getFullYear(),n.getMonth(),1);render()}
try{
 firebase.initializeApp(firebaseConfig);db=firebase.firestore();
 db.collection('config').doc('plan').onSnapshot({includeMetadataChanges:true},snap=>{
  if(!snap.exists){if(!snap.metadata.fromCache&&!planLoaded){planLoaded=true;plan=JSON.parse(JSON.stringify(SEED));init();savePlan()}return}
  const first=!plan;plan=snap.data();plan.people=plan.people||[];plan.tasks=plan.tasks||[];plan.start=plan.start||SEED.start;
  planLoaded=true;assignCache=null;if(first)init();
  setStatus(snap.metadata.fromCache?'':'ok',snap.metadata.fromCache?'Offline – Änderungen werden nachgereicht':'Für alle synchronisiert');
  softRender();
 },err=>{console.error(err);setStatus('err','Keine Verbindung zur Datenbank – Regeln prüfen')});
 db.collection('checks').onSnapshot(qs=>{const c={};qs.forEach(d=>{c[d.id]=d.data()});checks=c;if(plan)softRender()},err=>console.error(err));
}catch(e){console.error(e);setStatus('err','Datenbank nicht erreichbar')}
</script>
</body>
</html>
