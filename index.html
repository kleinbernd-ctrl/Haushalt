<style>

.tour-pad{height:190px}

@media (min-width:600px){.dlg-bg{align-items:center}}

.dlg h3{font-size:17px;margin:0 0 8px}
.dlg p{margin:0 0 4px;font-size:15px;line-height:1.5;color:var(--ink);white-space:normal}
.dlg .choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.dlg .choices button{justify-content:flex-start;display:flex;align-items:center;gap:10px;padding:12px;font-size:16px}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:90;max-width:480px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:14px;transform:translateY(140%);transition:transform .2s ease;pointer-events:none}
#toast.on{transform:none;pointer-events:auto}
#toast .btn{background:transparent;color:var(--bg);border-color:var(--bg)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.mechip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:13px;display:flex;align-items:center;gap:6px;max-width:130px;white-space:nowrap;overflow:hidden}
.overdue{border-color:var(--red)}
@media (max-width:480px){.status span{display:none}}
@media (prefers-reduced-motion:no-preference){.tour{animation:tin .2s ease-out}@keyframes tin{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}}

 <header><h1 id="ttl">Haushaltsplan</h1><div class="hright"><div id="st" class="status"><i></i><span>Verbinde…</span></div><button id="meBtn" class="mechip" data-a="pickMe" hidden></button><button class="hbtn" data-a="tour" aria-label="Führung durch die Funktionen">?</button></div></header>
 <div id="app"><p class="muted">Lade…</p></div>

<script>
const firebaseConfig={apiKey:"AIzaSyAySkjUJKdug-upeiQxYIjKnjcv_H6DKiM",authDomain:"haushalt-bf7a1.firebaseapp.com",projectId:"haushalt-bf7a1",storageBucket:"haushalt-bf7a1.firebasestorage.app",messagingSenderId:"119943513849",appId:"1:119943513849:web:d75866dde66e2b5610c428"};

const INTERVALS=[['daily','täglich',1],['weekly','wöchentlich',1],['biweekly','alle 2 Wochen',2],['3weekly','alle 3 Wochen',3],['monthly','monatlich (alle 4 Wochen)',4],['quarterly','vierteljährlich (alle 13 Wochen)',13]];
const IV={};INTERVALS.forEach(x=>IV[x[0]]={label:x[1],n:x[2]});
const COLORS=['#2b5d8a','#c0563f','#2e8a5a','#8456b0','#c28a1e','#21918f','#b5487a','#5b6b7a'];
const WD=['Mo','Di','Mi','Do','Fr','Sa','So'];
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const DAY=864e5;
const APP_VERSION='5.0';
const DATA_VERSION=3;
const CHANGELOG={'5.0':['Beim Start „Wer bist du?“: Die Seite zeigt zuerst deine Aufgaben','„Noch offen aus Vorwochen“ in der aktuellen Woche','Eigene Dialoge und „Rückgängig“ nach dem Abhaken','Vergangene Wochen bleiben fest, auch wenn der Plan geändert wird','Tauschangebote per WhatsApp, Signal & Co. teilen','Mitglieder verwalten, Einladungscode erneuern, Haushalt verlassen','Als App auf dem Home-Bildschirm installierbar'],'4.2':['Kalender-Export funktioniert jetzt auch auf Android','Erklärungen zum Kalender-Export und zur Anmeldung'],'4.1':['Kalender-Export: Aufgaben als Termine in den iPhone- oder Google-Kalender übernehmen','Hinweis zum Einladungscode auf der Anmeldeseite'],'4.0':['Geldkonto pro Person mit Stundenlohn je Aufgabe','Verdienst-Grafik nach Woche, Monat oder Jahr','Logbuch für Änderungen an Aufgaben und Personen','Führung durch die Funktionen (Fragezeichen oben)','Sicherung herunterladen und einspielen']};
const eur=v=>(Math.round((+v||0)*100)/100).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const r2=v=>Math.round(v*100)/100;
const BAD=['Spiegel putzen','Waschbecken und Armatur reinigen','Toilette putzen','Dusche/Wanne reinigen','Boden wischen'];
function T(id,name,min,iv,off,steps){return{id,name,min,iv,person:'',off,steps}}
const TEMPLATE=[
 T('bad','Bad putzen',30,'weekly',0,BAD.slice()),
 T('kueche','Küche putzen',30,'weekly',0,['Arbeitsflächen abwischen','Herd und Spüle reinigen','Boden wischen']),
 T('saugen','Staubsaugen',30,'weekly',0,[]),
 T('wischen','Boden wischen',45,'biweekly',1,[]),
 T('muell','Müll rausbringen',5,'weekly',0,[]),
 T('waesche','Wäsche waschen',60,'weekly',0,[]),
 T('pflanzen','Pflanzen gießen',10,'weekly',0,[])
];

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore(),auth=firebase.auth(),FV=firebase.firestore.FieldValue;
let user=null,hid=null,mode='loading',unsubs=[],authMsg='',busy=false;
let calOpen=false,calCfg={who:'',weeks:12,day:5,daily:false,alarm:true},migrating=false,payouts=[],logs=[],tour=null,newVer=null,period='month',whatsNew=null;
let plan=null,checks={},swaps=[],assignCache=null,edit=null,tab='week',sel='all',me=null,curWeek=0,viewMonth=null,nameOf={};
try{tab=localStorage.getItem('hh_tab')||'week';sel=localStorage.getItem('hh_sel')||'all'}catch(e){}
function persist(){try{localStorage.setItem('hh_tab',tab);localStorage.setItem('hh_sel',sel);if(hid)localStorage.setItem('hh_me_'+hid,me||'')}catch(e){}}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,10);
function parseD(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function startMon(){return mondayOf(parseD(plan.start))}
function weekIdx(d){return Math.round((mondayOf(d)-startMon())/(7*DAY))}
function weekMon(i){const s=startMon();return new Date(s.getFullYear(),s.getMonth(),s.getDate()+7*i)}
function wid(i){return 'w'+iso(weekMon(i)).replace(/-/g,'')}
function widDate(w){return new Date(+w.slice(1,5),+w.slice(5,7)-1,+w.slice(7,9))}
function widIdx(w){return weekIdx(widDate(w))}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/DAY+1)/7)}
function fmtMin(m){m=Math.round(m);if(m<60)return m+' Min';const h=Math.floor(m/60),r=m%60;return h+' Std'+(r?' '+r+' Min':'')}
function fmtDate(d){return d.getDate()+'.'+(d.getMonth()+1)+'.'}
function occLabel(w){const d=widDate(w);return 'KW '+isoWeek(d)+' ('+fmtDate(d)+')'}
function person(id){return plan.people.find(p=>p.id===id)}
function pcol(id){const p=person(id);return p?p.color:'var(--grey)'}
function nowWeek(){return weekIdx(new Date())}
function H(){return db.collection('households').doc(hid)}

/* Verteilung */
function due(t,i){if(i<0)return false;const n=(IV[t.iv]||IV.weekly).n;return(((i-(t.off||0))%n)+n)%n===0}
function weekMin(t){return t.iv==='daily'?t.min*7:t.min}
function baseAssign(i){
 if(i<0||i>5200||!plan.people.length)return[];
 const ppl=plan.people,ids=new Set(ppl.map(p=>p.id));
 if(!assignCache){assignCache={weeks:[],load:{}};ppl.forEach(p=>assignCache.load[p.id]=0)}
 const C=assignCache;
 while(C.weeks.length<=i){
  const w=C.weeks.length,fz=frozenList(wid(w));
  if(fz){fz.forEach(x=>{if(C.load[x.p]!==undefined)C.load[x.p]+=weekMin(x.t)});C.weeks.push(fz);continue}
  const list=[],tasks=plan.tasks.filter(t=>due(t,w));
  tasks.forEach(t=>{if(t.person&&ids.has(t.person)){list.push({t,p:t.person});C.load[t.person]+=weekMin(t)}});
  const pool=tasks.filter(t=>!(t.person&&ids.has(t.person))).sort((a,b)=>weekMin(b)-weekMin(a)||a.id.localeCompare(b.id));
  pool.forEach(t=>{let best=null,bv=Infinity;for(let k=0;k<ppl.length;k++){const p=ppl[(k+w)%ppl.length].id;if(C.load[p]<bv-1e-9){bv=C.load[p];best=p}}list.push({t,p:best});C.load[best]+=weekMin(t)});
  C.weeks.push(list);
 }
 return C.weeks[i];
}
function assign(i){
 const o=plan.over||{},w=i>=0?wid(i):'',b=baseAssign(i);
 if(b.length&&b[0].fz)return b;
 return b.map(x=>{const p=o[w+'|'+x.t.id];return p&&person(p)?{t:x.t,p,sw:true}:x});
}
function keysFor(t){return t.iv==='daily'?[0,1,2,3,4,5,6].map(d=>t.id+'_'+d):[t.id]}
function rec(i,k){const v=(checks[wid(i)]||{})[k];return v&&typeof v==='object'?v:null}
function status(i,p){
 const a=assign(i).filter(x=>x.p===p);if(!a.length)return null;
 if(a.every(x=>keysFor(x.t).every(k=>rec(i,k))))return 'done';
 return i>nowWeek()?'future':'open';
}

/* Tausch-Helfer */
function openSwaps(){const nw=nowWeek();return swaps.filter(s=>s.status==='open'&&widIdx(s.w)>=nw)}
function lockedSet(){const L=new Set();openSwaps().forEach(s=>{L.add(s.w+'|'+s.task);(s.offers||[]).forEach(o=>L.add(o.w+'|'+o.task))});return L}
function occOwner(w,task){const x=assign(widIdx(w)).find(x=>x.t.id===task);return x?x.p:null}
function occStarted(w,task){const t=plan.tasks.find(t=>t.id===task);return t?keysFor(t).some(k=>rec(widIdx(w),k)):true}
function myOccurrences(exclude){
 const nw=Math.max(0,nowWeek()),L=lockedSet(),out=[];
 for(let i=nw;i<nw+52;i++){const w=wid(i);assign(i).forEach(x=>{
  const key=w+'|'+x.t.id;if(x.p!==me||L.has(key)||key===exclude||keysFor(x.t).some(k=>rec(i,k)))return;
  out.push({v:key,l:occLabel(w)+': '+x.t.name+', '+fmtMin(weekMin(x.t))});
 })}
 return out;
}
function swapTodo(){if(!me)return 0;return openSwaps().filter(s=>s.from===me&&(s.offers||[]).length).length}

/* Speichern */
function setStatus(c,txt){const s=$('#st');s.className='status '+c;s.querySelector('span').textContent=txt}
function fail(e){console.error(e);setStatus('err','Speichern fehlgeschlagen');uiAlert('Speichern fehlgeschlagen: '+(e&&e.message||e),'Fehler')}
function savePlan(){
 assignCache=null;render();

/* Logbuch */
function logEntry(act,what,detail){
 if(!hid)return;const by=me&&person(me)?person(me).name:'';
 H().collection('log').add({ts:Date.now(),d:new Date().toISOString(),by,act,what:what||'',detail:detail||''}).catch(e=>console.error(e));

function taskSummary(t){return t.min+' Min, '+(IV[t.iv]||IV.weekly).label+', '+(t.person&&person(t.person)?'fest: '+person(t.person).name:'Pool')+(+t.wage>0?', '+eur(t.wage)+'/Std':'')}
function taskDiff(a,b){
 const d=[],who=t=>t.person&&person(t.person)?person(t.person).name:'Pool';
 if(a.name!==b.name)d.push('Name: '+a.name+' → '+b.name);
 if(+a.min!==+b.min)d.push('Dauer: '+a.min+' → '+b.min+' Min');
 if(a.iv!==b.iv)d.push('Intervall: '+(IV[a.iv]||IV.weekly).label+' → '+(IV[b.iv]||IV.weekly).label);
 if((a.person||'')!==(b.person||''))d.push('Zuständig: '+who(a)+' → '+who(b));
 if((+a.wage||0)!==(+b.wage||0))d.push('Stundenlohn: '+eur(a.wage)+' → '+eur(b.wage));
 if(JSON.stringify(a.steps||[])!==JSON.stringify(b.steps||[]))d.push('Schritte geändert ('+(a.steps||[]).length+' → '+(b.steps||[]).length+')');
 return d.join('; ');
}
function fmtTs(ts){const d=new Date(ts);return d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear()+', '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}

/* Geld */
function earningsList(){const out=[];Object.values(checks).forEach(doc=>Object.values(doc||{}).forEach(v=>{if(v&&typeof v==='object'&&v.p&&+v.e>0)out.push(v)}));return out}
function balance(pid){let b=0;earningsList().forEach(v=>{if(v.p===pid)b+=+v.e});payouts.forEach(x=>{if(x.p===pid)b-=+x.amount});return b}
function periodKeys(){
 const now=new Date(),keys=[];
 if(period==='week'){let m=mondayOf(now);for(let k=11;k>=0;k--){const d=new Date(m.getFullYear(),m.getMonth(),m.getDate()-7*k);keys.push({k:iso(d),l:'KW'+isoWeek(d)})}}
 else if(period==='month'){for(let k=11;k>=0;k--){const d=new Date(now.getFullYear(),now.getMonth()-k,1);keys.push({k:iso(d).slice(0,7),l:MONTHS[d.getMonth()].slice(0,3)})}}
 else{for(let k=4;k>=0;k--){const y=now.getFullYear()-k;keys.push({k:String(y),l:String(y)})}}

}
function keyOf(t){if(!t)return '';if(period==='week')return iso(mondayOf(parseD(t)));if(period==='month')return t.slice(0,7);return t.slice(0,4)}
function chartSvg(keys,data,ids){
 const W=340,Hh=170,pl=34,pb=22,pt=8,cw=(W-pl-6)/keys.length,bw=Math.max(6,cw*0.62);
 const tots=keys.map(k=>ids.reduce((s,id)=>s+((data[k.k]||{})[id]||0),0)),max=Math.max(1,...tots);
 const step=[1,2,5,10,20,25,50,100,200,250,500,1000].find(s=>max/s<=4)||Math.ceil(max/4);const top=Math.ceil(max/step)*step;
 let g='';for(let v=0;v<=top+1e-9;v+=step){const y=pt+(Hh-pt-pb)*(1-v/top);g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-4}" y="${y+3}" text-anchor="end">${v} €</text>`}
 keys.forEach((k,i)=>{let y0=Hh-pb;const x=pl+i*cw+(cw-bw)/2;
  ids.forEach(id=>{const v=(data[k.k]||{})[id]||0;if(!v)return;const h=(Hh-pt-pb)*v/top;y0-=h;g+=`<rect x="${x}" y="${y0}" width="${bw}" height="${h}" rx="2" fill="${pcol(id)}"><title>${esc(pname(id))}: ${eur(v)}</title></rect>`});
  g+=`<text x="${x+bw/2}" y="${Hh-6}" text-anchor="middle">${esc(k.l)}</text>`});
 return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Verdienst je Zeitraum">${g}</svg>`;
}

 else{h+=chartSvg(keys,data,ids);h+=`<div class="legend">${ids.map(id=>`<span><i class="dot" style="background:${pcol(id)}"></i>${esc(pname(id))}: ${eur(sum[id])}</span>`).join('')}</div><div class="muted small" style="margin-top:6px">Summe im angezeigten Zeitraum (${period==='week'?'12 Wochen':period==='month'?'12 Monate':'5 Jahre'}).</div>`}
 h+=`</div>`;

function icsEsc(t){return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
function icsFold(line){const enc=new TextEncoder();if(enc.encode(line).length<=74)return line;let out='',cur='',n=0;for(const ch of line){const b=enc.encode(ch).length;if(n+b>73){out+=cur+'\r\n ';cur='';n=1}cur+=ch;n+=b}return out+cur}
function icsDate(d){return iso(d).replace(/-/g,'')}
function exportIcs(){
 const c=calCfg,nw=Math.max(0,nowWeek()),now=new Date(),stamp=now.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Haushaltsplan//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+icsEsc('Haushalt – '+(plan.name||''))];

  const mon=weekMon(i),w=wid(i);

   if(c.who!=='all'&&x.p!==c.who)return;
   const daily=x.t.iv==='daily';if(daily&&!c.daily)return;
   const days=daily?[0,1,2,3,4,5,6]:[c.day];
   days.forEach(k=>{
    const d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+k),d2=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
    const who=pname(x.p),sum=x.t.name+(c.who==='all'?' ('+who+')':'');

    L.push('BEGIN:VEVENT','UID:'+hid+'-'+w+'-'+x.t.id+(daily?'-'+k:'')+'@haushaltsplan','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+icsDate(d),'DTEND;VALUE=DATE:'+icsDate(d2),'SUMMARY:'+icsEsc(sum),'DESCRIPTION:'+icsEsc(desc),'TRANSP:TRANSPARENT');
    if(c.alarm)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(sum),'TRIGGER:-PT6H','END:VALARM');
    L.push('END:VEVENT');n++;
   });
  });
 }
 L.push('END:VCALENDAR');
 if(!n){uiAlert('Im gewählten Zeitraum gibt es keine Aufgaben.');return}
 const ics=L.map(icsFold).join('\r\n')+'\r\n',blob=new Blob([ics],{type:'text/calendar;charset=utf-8'}),url=URL.createObjectURL(blob);
 const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 const fname='haushalt-'+(c.who==='all'?'alle':pname(c.who).toLowerCase().replace(/[^a-z0-9äöüß]+/g,'-'))+'.ics';
 const android=/Android/i.test(navigator.userAgent);
 const download=()=>{const a=document.createElement('a');a.href=url;a.download=fname;a.type='text/calendar';document.body.appendChild(a);a.click();a.remove()};
 if(ios){location.href=url}
 else if(android){
  let file=null;try{file=new File([ics],fname,{type:'text/calendar'})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
   navigator.share({files:[file],title:'Haushalt-Termine'}).catch(err=>{if(err&&err.name!=='AbortError')download()});
  }else download();
 }
 else download();
 setTimeout(()=>URL.revokeObjectURL(url),60000);
}

function frozenList(w){const f=(plan.frozen||{})[w];if(!f)return null;return f.map(e=>{const live=plan.tasks.find(t=>t.id===e.i)||{};return{t:Object.assign({steps:[],wage:0},live,{id:e.i,name:e.n,min:e.m,iv:e.v}),p:e.p,fz:true}})}
function ensureFrozen(){
 const nw=nowWeek();if(nw<=0||!plan)return;const f=plan.frozen||{},pf={};
 for(let i=Math.max(0,nw-104);i<nw;i++){const w=wid(i);if(!f[w])pf[w]=assign(i).map(x=>({i:x.t.id,p:x.p,n:x.t.name,m:x.t.min,v:x.t.iv}))}
 const keys=Object.keys(pf);if(!keys.length)return;
 plan.frozen=Object.assign({},f,pf);assignCache=null;
 const FP=firebase.firestore.FieldPath,args=[];keys.forEach(w=>args.push(new FP('frozen',w),pf[w]));
 H().update(...args).catch(e=>console.error(e));
}

/* Noch offen aus Vorwochen */
function viewOverdue(ppl){
 const nw=nowWeek(),ids=new Set(ppl.map(p=>p.id)),items=[];
 for(let j=Math.max(0,nw-8);j<nw;j++)assign(j).forEach(x=>{if(ids.has(x.p)&&!keysFor(x.t).every(k=>rec(j,k)))items.push({j,x})});
 if(!items.length)return '';
 let h=`<div class="box overdue"><div class="ph"><h3>Noch offen aus Vorwochen</h3><span class="sp"></span><span class="badge open">${items.length}</span></div>`;
 items.forEach(({j,x})=>{const t=x.t,mon=weekMon(j),daily=t.iv==='daily';
  h+=`<div class="task"><div class="row">`;
  if(daily){const done=keysFor(t).filter(k=>rec(j,k)).length;h+=`<span class="chk" aria-hidden="true"></span><span class="sp">${esc(t.name)} <span class="muted small">${done} von 7 Tagen</span></span>`}
  else h+=`<button class="chk" data-a="chk" data-w="${j}" data-t="${t.id}" data-p="${x.p}" data-k="${t.id}" aria-label="${esc(t.name)} erledigt"></button><span class="sp">${esc(t.name)}</span>`;
  h+=`<span class="muted small">${ppl.length>1?esc(pname(x.p))+', ':''}KW ${isoWeek(mon)}</span>${daily?`<button class="btn sm" data-a="week" data-v="${j}">Öffnen</button>`:''}</div></div>`});
 return h+`</div>`;
}
/* Tauschliste gruppieren */
function groupOpts(opts){const g={};opts.forEach(o=>{const k=o.l.split(': ')[0];(g[k]=g[k]||[]).push(o)});return Object.entries(g).map(([k,list])=>`<optgroup label="${esc(k)}">${list.map(o=>`<option value="${esc(o.v)}">${esc(o.l.split(': ').slice(1).join(': '))}</option>`).join('')}</optgroup>`).join('')}

/* Messenger */
function msgOffer(from,tname,w){return '🔄 Tauschangebot von '+pname(from)+': „'+tname+'“ in '+occLabel(w)+'. Wer übernimmt? Gegenangebot hier:'}
async function shareMsg(text){
 const url=location.origin+location.pathname+'#tausch',full=text+'\n'+url;
 if(navigator.share){try{await navigator.share({text:full});return}catch(e){if(e&&e.name==='AbortError')return}}
 const ch=await dlgShow({title:'Nachricht teilen',text:full,choices:[{v:'wa',l:'In WhatsApp öffnen'},{v:'copy',l:'Text kopieren (für Signal & Co.)'}],cancel:'Schließen'});
 if(ch==='wa')window.open('https://wa.me/?text='+encodeURIComponent(full),'_blank');
 if(ch==='copy'){try{await navigator.clipboard.writeText(full);toast('Text kopiert')}catch(e){uiAlert(full,'Zum Kopieren')}}
}

/* Zugang und Mitglieder */
function viewAccess(){
 const mi=plan.memberInfo||{},mem=plan.members||[];
 let h=`<h2>Zugang</h2><div class="box"><div class="small">Angemeldet als <b>${esc(user.email)}</b></div>
 <div class="muted small" style="margin-top:6px">Alle im Haushalt können sich mit diesen Zugangsdaten anmelden. Wer ein eigenes Konto möchte, erstellt eins und tritt mit diesem Code bei:</div>
 <div class="code">${esc(plan.code)}</div><div class="row" style="flex-wrap:wrap"><button class="btn sm" data-a="copyCode">Code kopieren</button><button class="btn sm" data-a="renewCode">Code erneuern</button></div></div>`;
 h+=`<h2>Konten im Haushalt</h2><div class="box">`+mem.map(uid=>`<div class="ti"><span class="sp small">${esc(mi[uid]||'Konto ohne bekannte E-Mail')}${uid===user.uid?' <span class="muted">(dieses Gerät)</span>':''}</span>${uid===user.uid?'':`<button class="btn sm del" data-a="memRemove" data-v="${esc(uid)}">Entfernen</button>`}</div>`).join('')+`</div>`;
 h+=`<div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn del" data-a="logout">Abmelden</button><button class="btn del" data-a="leave">Haushalt verlassen</button></div>`;
 return h;
}

render();
