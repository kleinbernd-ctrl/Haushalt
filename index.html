function readForm(){

function taskDiff(a,b){
 const d=[],who=t=>t.person&&person(t.person)?person(t.person).name:'Pool';
 if(a.name!==b.name)d.push('Name: '+a.name+' → '+b.name);
 if(+a.min!==+b.min)d.push('Dauer: '+a.min+' → '+b.min+' Min');
 if(a.iv!==b.iv&&a.mode!=='flex'&&b.mode!=='flex')d.push('Intervall: '+(IV[a.iv]||IV.weekly).label+' → '+(IV[b.iv]||IV.weekly).label);

 if((+a.wage||0)!==(+b.wage||0))d.push('Stundenlohn: '+eur(a.wage)+' → '+eur(b.wage));
 if(JSON.stringify(a.steps||[])!==JSON.stringify(b.steps||[]))d.push('Schritte geändert ('+(a.steps||[]).length+' → '+(b.steps||[]).length+')');
 return d.join('; ');
}

function earningsList(){const out=[];Object.values(checks).forEach(doc=>Object.values(doc||{}).forEach(v=>{if(v&&typeof v==='object'&&v.p&&+v.e>0)out.push(v)}));return out}
function balance(pid){let b=0;earningsList().forEach(v=>{if(v.p===pid)b+=+v.e});payouts.forEach(x=>{if(x.p===pid)b-=+x.amount});return b}
function periodKeys(){
 const now=new Date(),keys=[];
 if(period==='week'){let m=mondayOf(now);for(let k=11;k>=0;k--){const d=new Date(m.getFullYear(),m.getMonth(),m.getDate()-7*k);keys.push({k:iso(d),l:'KW'+isoWeek(d)})}}
 else if(period==='month'){for(let k=11;k>=0;k--){const d=new Date(now.getFullYear(),now.getMonth()-k,1);keys.push({k:iso(d).slice(0,7),l:MONTHS[d.getMonth()].slice(0,3)})}}
 else{for(let k=4;k>=0;k--){const y=now.getFullYear()-k;keys.push({k:String(y),l:String(y)})}}
 return keys;
}
function keyOf(t){if(!t)return '';if(period==='week')return iso(mondayOf(parseD(t)));if(period==='month')return t.slice(0,7);return t.slice(0,4)}
function chartSvg(keys,data,ids){
 const W=340,Hh=170,pl=34,pb=22,pt=8,cw=(W-pl-6)/keys.length,bw=Math.max(6,cw*0.62);
 const tots=keys.map(k=>ids.reduce((s,id)=>s+((data[k.k]||{})[id]||0),0)),max=Math.max(1,...tots);
 const step=[1,2,5,10,20,25,50,100,200,250,500,1000].find(s=>max/s<=4)||Math.ceil(max/4);const top=Math.ceil(max/step)*step;
 let g='';for(let v=0;v<=top+1e-9;v+=step){const y=pt+(Hh-pt-pb)*(1-v/top);g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-4}" y="${y+3}" text-anchor="end">${v} €</text>`}
 keys.forEach((k,i)=>{let y0=Hh-pb;const x=pl+i*cw+(cw-bw)/2;
  ids.forEach(id=>{const v=(data[k.k]||{})[id]||0;if(!v)return;const h=(Hh-pt-pb)*v/top;y0-=h;g+=`<rect x="${x}" y="${y0}" width="${bw}" height="${h}" rx="2" fill="${pcol(id)}"><title>${esc(pname(id))}: ${eur(v)}</title></rect>`});
  g+=`<text x="${x+bw/2}" y="${Hh-6}" text-anchor="middle">${esc(k.l)}</text>`});
 return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Verdienst je Zeitraum">${g}</svg>`;
}
function viewMoney(){

 let h=`<h2>Geldkonten</h2>`;
 if(!wal.length&&!el.length)return h+`<div class="box muted small">Noch kein Geldkonto aktiv. Unter <b>Einstellungen → Personen</b> kannst du bei einer Person „Geldkonto“ anhaken und unter <b>Einstellungen → Aufgaben</b> einen Stundenlohn eintragen.</div>`;
 h+=`<div class="box">`+wal.map(p=>{const b=balance(p.id);return `<div class="ti"><span class="dot" style="background:${p.color}"></span><b class="sp">${esc(p.name)}</b><span class="money ${b<0?'neg':''}">${eur(b)}</span><button class="btn sm" data-a="payout" data-v="${p.id}">Auszahlen</button></div>`}).join('')+(wal.length?'':'<div class="muted small">Kein Geldkonto aktiv.</div>')+`</div>`;
 const keys=periodKeys(),data={},ids=[];
 el.forEach(v=>{const k=keyOf(v.t);(data[k]=data[k]||{})[v.p]=((data[k]||{})[v.p]||0)+(+v.e);if(!ids.includes(v.p))ids.push(v.p)});
 ids.sort((a,b)=>plan.people.findIndex(p=>p.id===a)-plan.people.findIndex(p=>p.id===b));
 const sum={};keys.forEach(k=>ids.forEach(id=>{sum[id]=(sum[id]||0)+((data[k.k]||{})[id]||0)}));
 h+=`<h2>Verdienst</h2><div class="box"><div class="seg">${[['week','Wöchentlich'],['month','Monatlich'],['year','Jährlich']].map(([k,l])=>`<button data-a="period" data-v="${k}" class="${period===k?'on':''}">${l}</button>`).join('')}</div>`;
 if(!ids.length)h+=`<div class="muted small" style="margin-top:10px">Noch nichts verdient. Sobald jemand mit Geldkonto eine bezahlte Aufgabe abhakt, erscheint hier die Grafik.</div>`;
 else{h+=chartSvg(keys,data,ids);h+=`<div class="legend">${ids.map(id=>`<span><i class="dot" style="background:${pcol(id)}"></i>${esc(pname(id))}: ${eur(sum[id])}</span>`).join('')}</div><div class="muted small" style="margin-top:6px">Summe im angezeigten Zeitraum (${period==='week'?'12 Wochen':period==='month'?'12 Monate':'5 Jahre'}).</div>`}
 h+=`</div>`;
 const pays=payouts.slice().sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,10);
 if(pays.length)h+=`<h2>Auszahlungen</h2><div class="box">`+pays.map(x=>`<div class="ti"><span class="dot" style="background:${pcol(x.p)}"></span><span class="sp">${esc(person(x.p)?person(x.p).name:x.pn)}</span><span class="muted small">${esc(x.date.split('-').reverse().join('.'))}</span><span class="money">${eur(x.amount)}</span></div>`).join('')+`</div>`;
 return h;
}

async function importBackup(file){

  if(!await uiConfirm('Sicherung vom '+String(d.exported).slice(0,10)+' einspielen?\n\nAufgaben, Personen und Planstart werden ersetzt. Häkchen und Auszahlungen aus der Sicherung werden ergänzt.','Einspielen',true))return;

  (d.payouts||[]).forEach(x=>ops.push(b=>b.set(H().collection('payouts').doc('imp'+(x.ts||rid())+'_'+x.p),x)));
  for(let i=0;i<ops.length;i+=400){const b=db.batch();ops.slice(i,i+400).forEach(f=>f(b));await b.commit()}
  logEntry('Sicherung eingespielt',String(d.exported).slice(0,10),'');toast('Sicherung eingespielt');
 }catch(e){fail(e)}finally{const f=$('#importFile');if(f)f.value=''}
}

function icsEsc(t){return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
function icsFold(line){const enc=new TextEncoder();if(enc.encode(line).length<=74)return line;let out='',cur='',n=0;for(const ch of line){const b=enc.encode(ch).length;if(n+b>73){out+=cur+'\r\n ';cur='';n=1}cur+=ch;n+=b}return out+cur}
function icsDate(d){return iso(d).replace(/-/g,'')}
function exportIcs(){
 const c=calCfg,nw=Math.max(0,nowWeek()),now=new Date(),stamp=now.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Haushaltsplan//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+icsEsc('Haushalt – '+(plan.name||''))];
 let n=0;
 for(let i=nw;i<nw+c.weeks;i++){
  const mon=weekMon(i),w=wid(i);
  assign(i).forEach(x=>{
   if(c.who!=='all'&&x.p!==c.who)return;
   const daily=x.t.iv==='daily';if(daily&&!c.daily)return;
   const days=daily?[0,1,2,3,4,5,6]:[c.day];
   days.forEach(k=>{
    const d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+k),d2=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
    const who=pname(x.p),sum=x.t.name+(c.who==='all'?' ('+who+')':'');
    let desc=x.t.min+' Min'+(daily?' pro Tag':'')+', zuständig: '+who+(daily?'':'\nZu erledigen in KW '+isoWeek(mon));
    if(x.t.steps&&x.t.steps.length)desc+='\n\nWas ist zu tun:\n'+x.t.steps.map(s=>'– '+s).join('\n');
    L.push('BEGIN:VEVENT','UID:'+hid+'-'+w+'-'+x.t.id+(daily?'-'+k:'')+'@haushaltsplan','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+icsDate(d),'DTEND;VALUE=DATE:'+icsDate(d2),'SUMMARY:'+icsEsc(sum),'DESCRIPTION:'+icsEsc(desc),'TRANSP:TRANSPARENT');
    if(c.alarm)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(sum),'TRIGGER:-PT6H','END:VALARM');
    L.push('END:VEVENT');n++;
   });
  });
 }
 L.push('END:VCALENDAR');
 if(!n){uiAlert('Im gewählten Zeitraum gibt es keine Aufgaben.');return}
 const ics=L.map(icsFold).join('\r\n')+'\r\n',blob=new Blob([ics],{type:'text/calendar;charset=utf-8'}),url=URL.createObjectURL(blob);
 const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 const fname='haushalt-'+(c.who==='all'?'alle':pname(c.who).toLowerCase().replace(/[^a-z0-9äöüß]+/g,'-'))+'.ics';
 const android=/Android/i.test(navigator.userAgent);
 const download=()=>{const a=document.createElement('a');a.href=url;a.download=fname;a.type='text/calendar';document.body.appendChild(a);a.click();a.remove()};
 if(ios){location.href=url}
 else if(android){
  let file=null;try{file=new File([ics],fname,{type:'text/calendar'})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
   navigator.share({files:[file],title:'Haushalt-Termine'}).catch(err=>{if(err&&err.name!=='AbortError')download()});
  }else download();
 }
 else download();
 setTimeout(()=>URL.revokeObjectURL(url),60000);
}

 if(!pw)return;
 try{
  await user.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(user.email,pw));
  stopAll();
  if(hid){
   const ref=H();
   if(last){
    for(const c of ['checks','swaps','payouts','log']){const docs=(await ref.collection(c).get()).docs;for(let i=0;i<docs.length;i+=400){const b=db.batch();docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}}
    if(plan&&plan.code)await db.collection('codes').doc(plan.code).delete().catch(()=>{});
    await ref.delete();
   }else await ref.update({members:FV.arrayRemove(user.uid),['memberInfo.'+user.uid]:FV.delete()});
  }
  await db.collection('users').doc(user.uid).delete();
  await user.delete();
  uiAlert('Dein Konto wurde gelöscht.');
 }catch(e){
  console.error(e);
  if(e&&(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential'))uiAlert('Das Passwort stimmt nicht. Es wurde nichts gelöscht.');
  else{uiAlert('Löschen fehlgeschlagen: '+(e&&e.message||e)+'\nBitte lade die Seite neu und versuche es erneut.','Fehler')}
 }
}

/* Admin-Freigabe */
const GATED_ACTS=/^(Aufgabe |Person |Geldkonto |Planstart|Abwesenheit |Gruppe )/;
const PLAN_KEYS=['name','people','tasks','pools','start'];
const KEY_LABEL={name:'Haushaltsname',people:'Personen',tasks:'Aufgaben',pools:'Gruppen',start:'Planstart'};
function adminOn(){return !!(plan&&plan.admin&&plan.admin.on)}
function adminName(){return adminOn()?pname(plan.admin.person):''}
function gateActive(){return adminOn()&&!adminUnlocked}
function okToast(m){if(!gateActive())toast(m)}
function hashStr(t){let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return (h>>>0).toString(36)}
async function pinHash(pin,salt){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function proposeChange(){
 const changed={},base={};
 PLAN_KEYS.forEach(k=>{if(JSON.stringify(plan[k])!==JSON.stringify(serverPlan[k])){changed[k]=JSON.parse(JSON.stringify(plan[k]));base[k]=hashStr(JSON.stringify(serverPlan[k]))}});
 const summary=pendingLog.splice(0);
 plan=normalize(JSON.parse(JSON.stringify(serverPlan)));assignCache=null;edit=null;poolEdit=null;awayFor=null;
 if(!Object.keys(changed).length){render();return}
 if(!summary.length)summary.push({act:'Einstellung geändert',what:Object.keys(changed).map(k=>KEY_LABEL[k]).join(', '),detail:''});
 render();
 H().collection('proposals').add({ts:Date.now(),by:me&&person(me)?person(me).name:'',status:'open',summary,data:changed,base}).then(()=>toast('Als Vorschlag an '+adminName()+' gesendet')).catch(fail);
}
async function ensureAdmin(){
 if(!adminOn())return true;if(adminUnlocked)return true;
 const pin=await dlgShow({title:'Admin-PIN',text:'Bitte die PIN von '+adminName()+' eingeben.',input:'',inputType:'password',ok:'Entsperren',cancel:'Abbrechen'});
 if(!pin)return false;
 if(await pinHash(pin,plan.admin.salt)!==plan.admin.hash){uiAlert('Die PIN stimmt nicht.');return false}
 adminUnlocked=true;render();toast('Als Admin entsperrt');return true;
}
async function adminSetup(change){
 if(!plan.people.length){uiAlert('Leg zuerst Personen an.');return}
 const pid=await dlgShow({title:change?'Admin ändern':'Wer ist Admin?',text:'Der Admin bestätigt künftig alle Änderungen an Aufgaben, Personen und Gruppen mit seiner PIN.',choices:plan.people.map(p=>({v:p.id,l:p.name,color:p.color})),cancel:'Abbrechen'});
 if(!pid||!person(pid))return;
 const p1=await dlgShow({title:'PIN festlegen',text:'4 bis 8 Ziffern. Nur '+pname(pid)+' sollte sie kennen.',input:'',inputType:'password',ok:'Weiter',cancel:'Abbrechen'});
 if(!p1)return;if(!/^\d{4,8}$/.test(p1)){uiAlert('Die PIN muss aus 4 bis 8 Ziffern bestehen.');return}
 const p2=await dlgShow({title:'PIN wiederholen',input:'',inputType:'password',ok:'Speichern',cancel:'Abbrechen'});
 if(p2!==p1){if(p2!==null&&p2!==false)uiAlert('Die beiden PINs stimmen nicht überein.');return}
 const salt=rid()+rid(),hash=await pinHash(p1,salt);
 H().update({admin:{on:true,person:pid,salt,hash}}).then(()=>{adminUnlocked=true;logEntry(change?'Admin-Freigabe geändert':'Admin-Freigabe eingeschaltet',pname(pid),'');toast(change?'Admin-Einstellungen gespeichert':'Admin-Freigabe ist aktiv')}).catch(fail);
}
async function approveProposal(p){
 if(!await ensureAdmin())return;
 const conflicts=Object.keys(p.data||{}).filter(k=>p.base&&p.base[k]&&p.base[k]!==hashStr(JSON.stringify(serverPlan[k])));
 if(conflicts.length&&!await uiConfirm('Seit diesem Vorschlag wurden '+conflicts.map(k=>KEY_LABEL[k]).join(', ')+' schon anderweitig geändert. Beim Freigeben werden diese neueren Änderungen in diesem Bereich überschrieben.','Trotzdem freigeben',true))return;
 try{
  ensureFrozen();
  await H().update(JSON.parse(JSON.stringify(p.data)));
  const b=db.batch(),now=Date.now();(p.summary||[]).forEach((x,i)=>b.set(H().collection('log').doc(),{ts:now+i,d:new Date().toISOString(),by:p.by||'',act:x.act,what:x.what,detail:(x.detail?x.detail+' · ':'')+'freigegeben von '+adminName()}));
  b.update(H().collection('proposals').doc(p.id),{status:'approved',decided:now});await b.commit();
  toast('Freigegeben');
 }catch(e){fail(e)}
}
function adminBanner(){
 if(!adminOn())return '';
 return gateActive()
  ?`<div class="banner"><span class="sp">Admin-Freigabe aktiv: Änderungen gehen als Vorschlag an ${esc(adminName())}.</span><button class="btn sm" data-a="adminUnlock">Admin</button></div>`
  :`<div class="banner"><span class="sp">Als Admin (${esc(adminName())}) entsperrt: Änderungen gelten sofort.</span><button class="btn sm" data-a="adminLock">Sperren</button></div>`;
}
function viewAdminSetup(){
 let h=`<h2>Admin-Freigabe</h2><div class="box">`;
 if(!adminOn())return h+`<div class="muted small">Optional: Ein Admin bestätigt per PIN alle Änderungen an Aufgaben, Personen und Gruppen. Alle anderen können weiterhin Vorschläge machen, abhaken, tauschen und Aufgaben „Bei Bedarf“ buchen.</div><button class="btn sm" style="margin-top:8px" data-a="adminOn">Admin-Freigabe einschalten</button></div>`;
 return h+`<div class="small">Admin: <b>${esc(adminName())}</b> ${adminUnlocked?'<span class="tag">entsperrt</span>':''}</div><div class="muted small" style="margin-top:4px">Die PIN schützt vor versehentlichen Änderungen, ist aber kein Schutz gegen gezielte Manipulation, weil sich alle ein Konto teilen.</div><div class="row" style="margin-top:8px;flex-wrap:wrap">${adminUnlocked?'<button class="btn sm" data-a="adminLock">Sperren</button>':'<button class="btn sm" data-a="adminUnlock">Als Admin entsperren</button>'}<button class="btn sm" data-a="adminChange">Admin oder PIN ändern</button><button class="btn sm del" data-a="adminOff">Ausschalten</button></div></div>`;
}
function viewApprovals(){
 const open=proposals.filter(p=>p.status==='open'),done=proposals.filter(p=>p.status!=='open').slice(0,15);
 const lines=p=>`<ul style="margin:4px 0 0;padding-left:18px">${(p.summary||[]).map(x=>`<li><b>${esc(x.act)}</b>: ${esc(x.what)}${x.detail?` <span class="muted">· ${esc(x.detail)}</span>`:''}</li>`).join('')}</ul>`;
 let h=`<h2>Offene Vorschläge</h2>`;
 if(!open.length)h+=`<div class="box muted small">Keine offenen Vorschläge.</div>`;
 open.forEach(p=>{h+=`<div class="box"><div class="small muted">${fmtTs(p.ts)}${p.by?', von '+esc(p.by):''}</div>${lines(p)}<div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn pri sm" data-a="propOk" data-v="${p.id}">Freigeben</button><button class="btn sm del" data-a="propNo" data-v="${p.id}">Ablehnen</button>${me&&person(me)&&p.by===person(me).name?`<button class="btn sm" data-a="propWithdraw" data-v="${p.id}">Zurückziehen</button>`:''}</div></div>`});
 if(done.length)h+=`<h2>Entschieden</h2><div class="box">`+done.map(p=>`<div class="log"><span class="tag ${p.status==='approved'?'':'warn'}">${p.status==='approved'?'freigegeben':p.status==='rejected'?'abgelehnt':'zurückgezogen'}</span> <span class="muted">${fmtTs(p.ts)}${p.by?', von '+esc(p.by):''}</span>${lines(p)}</div>`).join('')+`</div>`;
 return h;
}

/* Beta-Feedback */
function isOperator(){return !!(user&&user.email&&user.email.toLowerCase()===OPERATOR.email.toLowerCase())}
function readFb(){if(!fb)return;const t=$('#fbText');if(t)fb.text=t.value;const a=$('#fbTech');if(a)fb.tech=a.checked;const c=$('#fbContact');if(c)fb.contact=c.checked}
function viewFeedback(){
 const types=['Fehler','Idee','Frage','Lob'];
 return `<div class="row" style="margin:6px 0"><button class="btn sm" data-a="fbClose">‹ Zurück</button></div>
 <h2>Feedback zur Beta-Version</h2><div class="box">
 <div class="muted small">Was funktioniert gut, was nicht, was fehlt? Beschreib es so konkret wie möglich, bei Fehlern am besten mit dem, was du gerade gemacht hast.</div>
 <div class="chips">${types.map(t=>`<button class="chip ${fb.type===t?'on':''}" data-a="fbType" data-v="${t}">${t}</button>`).join('')}</div>
 <label class="f" for="fbText">Deine Nachricht</label><textarea id="fbText" class="inp" maxlength="4000" placeholder="${fb.type==='Fehler'?'Was ist passiert, und was hast du erwartet?':fb.type==='Idee'?'Was würde dir helfen?':fb.type==='Frage'?'Was ist unklar?':'Was gefällt dir?'}">${esc(fb.text)}</textarea>
 <label class="cb"><input type="checkbox" id="fbTech" ${fb.tech?'checked':''}> <span>Technische Infos mitsenden (App-Version, Gerät, geöffneter Reiter)</span></label>
 <label class="cb"><input type="checkbox" id="fbContact" ${fb.contact?'checked':''}> <span>Rückfragen an ${esc(user?user.email:'meine E-Mail')} sind okay</span></label>
 <button class="btn pri wide" data-a="fbSend">Feedback senden</button></div>`;
}
async function sendFeedback(){
 if(!fb||!fb.text.trim()){uiAlert('Bitte schreib kurz, worum es geht.');return}
 const d={ts:Date.now(),date:new Date().toISOString(),type:fb.type,text:fb.text.trim().slice(0,4000),status:'neu',household:plan?plan.name||'':'',hid:hid||'',person:me&&plan&&person(me)?person(me).name:'',email:fb.contact&&user?user.email:''};
 if(fb.tech){d.version=APP_VERSION;d.ua=navigator.userAgent;d.tab=tab+(tab==='edit'?'/'+editTab:'');d.screen=window.innerWidth+'x'+window.innerHeight}
 try{await db.collection('feedback').add(d);fb=null;render();toast('Danke für dein Feedback!')}catch(e){fail(e)}
}
async function loadFeedback(){
 try{const qs=await db.collection('feedback').orderBy('ts','desc').limit(200).get();fbView=qs.docs.map(x=>Object.assign({id:x.id},x.data()));render();window.scrollTo(0,0)}
 catch(e){uiAlert('Feedback konnte nicht geladen werden. Sind die neuen Firestore-Regeln veröffentlicht?\n\n'+(e&&e.message||e),'Fehler')}
}
function viewFbList(){
 const list=fbView||[],open=list.filter(x=>x.status!=='erledigt').length;
 let h=`<div class="row" style="margin:6px 0"><button class="btn sm" data-a="fbAdminClose">‹ Zurück</button></div><h2>Eingegangenes Feedback</h2><div class="muted small">${list.length} insgesamt, ${open} offen</div>`;
 if(!list.length)h+=`<div class="box muted small">Noch kein Feedback eingegangen.</div>`;
 list.forEach(x=>{h+=`<div class="box ${x.status==='erledigt'?'':'overdue'}" style="${x.status==='erledigt'?'opacity:.65':''}"><div class="row"><span class="tag">${esc(x.type)}</span><span class="sp muted small">${fmtTs(x.ts)}</span><button class="btn sm" data-a="fbDone" data-v="${x.id}">${x.status==='erledigt'?'Wieder offen':'Erledigt'}</button></div>
 <div style="margin-top:8px;white-space:pre-wrap">${esc(x.text)}</div>
 <div class="muted small" style="margin-top:8px">${[x.household,x.person,x.version?'v'+x.version:'',x.tab].filter(Boolean).map(esc).join(' · ')}${x.email?` · <a href="mailto:${esc(x.email)}?subject=${encodeURIComponent('Dein Feedback zur Haushaltsseite')}">${esc(x.email)}</a>`:''}</div>${x.ua?`<div class="muted" style="font-size:11px;margin-top:4px">${esc(x.ua)}</div>`:''}</div>`});
 return h;
}

render();
</script>
