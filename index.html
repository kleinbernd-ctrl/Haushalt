<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fairloop – Haushalt fair verteilt</title>
<meta name="theme-color" content="#F6F6FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16151F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#1b2430;--mute:#647081;--line:#d9dee5;--acc:#2b5d8a;--accs:#dce7f2;--red:#cf3e4f;--green:#2e9a57;--grey:#b9c0ca;--chip:#e3e8ee;--warn:#b7791f;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#12161b;--card:#1b2128;--ink:#e8edf2;--mute:#97a3b1;--line:#2c343e;--acc:#7fb2e0;--accs:#22344a;--red:#ef6878;--green:#56c47f;--grey:#48525e;--chip:#252d36;--warn:#e0a84a}}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}
h1{font-size:22px;margin:0;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ttl::after{content:'Beta';font-size:10px;font-weight:700;letter-spacing:.04em;vertical-align:middle;margin-left:6px;padding:2px 6px;border-radius:999px;background:var(--accs);color:var(--acc)}
textarea.inp{min-height:130px;resize:vertical;font-family:inherit;line-height:1.45}
h2{font-size:17px;margin:22px 0 8px}
h3{font-size:15px;margin:0}
.status{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;flex:none}
.status i{width:8px;height:8px;border-radius:50%;background:var(--grey);display:inline-block}
.status.ok i{background:var(--green)}.status.err i{background:var(--red)}
.tabs{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{flex:1;border:0;background:none;padding:9px 1px;border-radius:9px;font-weight:600;color:var(--mute);font-size:13.5px;position:relative;white-space:nowrap;min-width:0}
@media (max-width:380px){.tabs button{font-size:12px}}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs sup{background:var(--red);color:#fff;border-radius:999px;font-size:10px;padding:1px 5px;margin-left:3px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;-webkit-overflow-scrolling:touch}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.muted{color:var(--mute)}
.small{font-size:13px}
.err{color:var(--red);font-size:14px;margin-top:8px}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.del{color:var(--red)}
.btn.sm{padding:4px 9px;font-size:13px;border-radius:8px}
.btn.wide{width:100%;margin-top:10px}
.link{border:0;background:none;color:var(--acc);padding:6px 0;font-size:14px}
.icon{border:0;background:none;padding:6px 10px;font-size:18px;color:var(--mute)}
.icon:disabled{opacity:.3}
.cal{width:100%;border-collapse:separate;border-spacing:0 3px;table-layout:fixed}
.cal th{font-size:11px;color:var(--mute);font-weight:600;padding:2px 0}
.cal td{text-align:center;padding:6px 0;font-size:14px}
.cal tr.wk{cursor:pointer}
.cal tr.wk.sel td{background:var(--accs)}
.cal tr.wk.sel td:first-child{border-radius:10px 0 0 10px}.cal tr.wk.sel td:last-child{border-radius:0 10px 10px 0}
.cal td.out{color:var(--grey)}
.cal td.today span{outline:2px solid var(--acc);border-radius:50%;padding:2px 5px}
.kw{font-size:11px;font-weight:700;border-radius:8px;padding:5px 0;display:block;margin:0 3px;color:var(--mute);background:var(--chip)}
.kw.open{background:var(--red);color:#fff}.kw.done{background:var(--green);color:#fff}
.kdots{display:flex;justify-content:center;gap:3px;margin-top:3px}
.kdots i{width:7px;height:7px;border-radius:50%;background:var(--grey)}
.kdots i.open{background:var(--red)}.kdots i.done{background:var(--green)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:6px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.badge{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;color:#fff}
.badge.open{background:var(--red)}.badge.done{background:var(--green)}.badge.future{background:var(--grey)}
.task{border-top:1px solid var(--line);padding:9px 0}
.chk{width:28px;height:28px;border-radius:8px;border:2px solid var(--grey);background:none;flex:none;display:grid;place-items:center;font-size:16px;color:#fff;padding:0}
.chk.on{background:var(--green);border-color:var(--green);cursor:default}
.done-t{text-decoration:line-through;color:var(--mute)}
.days{display:flex;gap:5px;margin:7px 0 0 36px;flex-wrap:wrap}
.days button{width:34px;height:30px;border-radius:7px;border:1.5px solid var(--grey);background:none;font-size:12px;padding:0}
.days button.on{background:var(--green);border-color:var(--green);color:#fff}
.days button.late{border-color:var(--red);color:var(--red)}.days button.on.late{color:#fff}
.days.pick{margin:6px 0 0}.days.pick label{cursor:pointer}.days.pick input{position:absolute;opacity:0;pointer-events:none}.days.pick span{display:inline-flex;align-items:center;justify-content:center;width:38px;height:32px;border-radius:8px;border:1.5px solid var(--grey);font-size:13px;font-weight:600}.days.pick input:checked+span{background:var(--acc);border-color:var(--acc);color:#fff}.days.pick input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.tag.late{background:transparent;border:1px solid var(--red);color:var(--red)}
.tbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tbar .clk,.clk{font-variant-numeric:tabular-nums;font-weight:700}
.dv{font-weight:700;border-radius:999px;padding:1px 7px;font-size:12px;white-space:nowrap}.dv.g{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}.dv.o{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}.dv.r{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.sub{margin:5px 0 0 36px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details{margin:5px 0 0 36px}
summary{font-size:13px;color:var(--acc);cursor:pointer}
details ul{margin:6px 0 0;padding-left:20px;font-size:14px}
.tag{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--accs);color:var(--acc)}
.tag.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.bar{display:grid;grid-template-columns:84px 1fr 86px;align-items:center;gap:8px;margin:7px 0;font-size:14px}
.bar .tr{height:14px;background:var(--chip);border-radius:7px;overflow:hidden}
.bar .tr b{display:block;height:100%;border-radius:7px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
table.hist{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.hist th,table.hist td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.hist th:first-child,table.hist td:first-child{text-align:left}
.ti{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:10px 0}
.ti:first-child{border-top:0}
label.f{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
label.cb{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:14px}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-size:16px}
.steps .row{margin-bottom:6px}
.code{font-size:26px;font-weight:700;letter-spacing:.12em;margin:8px 0;font-variant-numeric:tabular-nums}
.swap-arrow{color:var(--mute);margin:0 4px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hbtn{border:1px solid var(--line);background:var(--card);border-radius:50%;width:30px;height:30px;font-weight:700;color:var(--mute);flex:none;padding:0}
.hright{display:flex;align-items:center;gap:10px;flex:none}
.banner{background:var(--accs);color:var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:10px;font-size:14px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink)}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.money.neg{color:var(--red)}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart text{font-size:10px;fill:var(--mute)}
.log{font-size:13px;border-top:1px solid var(--line);padding:7px 0}
.log:first-child{border-top:0}
.tour{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:50;max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.tour h3{font-size:16px;margin-bottom:6px}
.tour p{margin:0 0 12px;font-size:14px;line-height:1.5}
.tour .cnt{font-size:12px;color:var(--mute)}
.tour-hl{outline:3px solid var(--acc)!important;outline-offset:3px;border-radius:12px}
.tour-pad{height:190px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mute)}
.dlg-bg{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.dlg-bg{align-items:center}}
.dlg{background:var(--card);border-radius:18px;padding:18px;width:100%;max-width:440px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.dlg h3{font-size:17px;margin:0 0 8px}
.dlg p{margin:0 0 4px;font-size:15px;line-height:1.5;color:var(--ink);white-space:normal}
.dlg .choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.dlg .choices button{justify-content:flex-start;display:flex;align-items:center;gap:10px;padding:12px;font-size:16px}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:90;max-width:480px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:14px;transform:translateY(140%);transition:transform .2s ease;pointer-events:none}
#toast.on{transform:none;pointer-events:auto}
#toast .btn{background:transparent;color:var(--bg);border-color:var(--bg)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.mechip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:13px;display:flex;align-items:center;gap:6px;max-width:130px;white-space:nowrap;overflow:hidden}
.overdue{border-color:var(--red)}
@media (max-width:480px){.status span{display:none}}
@media (prefers-reduced-motion:no-preference){.tour{animation:tin .2s ease-out}@keyframes tin{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}}

/* ===== Fairloop Design 12 ===== */
:root{--bg:#F6F6FB;--card:#FFFFFF;--ink:#1E1B33;--mute:#6D6A86;--line:#E7E6F2;--acc:#5A48E0;--acc2:#7C6CF0;--accs:#ECE9FF;--red:#EE5A52;--green:#17A673;--grey:#C8C7D8;--chip:#EEEDF7;--warn:#C27C0E;--shadow:0 1px 2px rgba(30,27,51,.04),0 6px 18px rgba(30,27,51,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#16151F;--card:#201E2D;--ink:#EEECFB;--mute:#A3A0BC;--line:#2F2C41;--acc:#8E80FF;--acc2:#A79CFF;--accs:#2B2750;--red:#FF7A72;--green:#3DCB93;--grey:#4A475E;--chip:#2A2839;--warn:#F0B44A;--shadow:none}}
body{font-family:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:15.5px;line-height:1.5;letter-spacing:.005em}
.wrap{max-width:640px;padding:10px 16px calc(96px + env(safe-area-inset-bottom,0px))}
header{margin:6px 0 14px;gap:10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.logo{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:10px;background:var(--acc);color:#fff}
.logo svg{width:20px;height:20px}
h1{font-size:21px;font-weight:800;letter-spacing:-.02em}
#ttl::after{background:var(--accs);color:var(--acc);font-weight:800;letter-spacing:.02em}
h2{font-size:15px;font-weight:800;letter-spacing:-.005em;margin:26px 2px 10px;color:var(--ink)}
h3{font-size:16px;font-weight:800}
.status span{display:none}
.mechip{border:0;background:var(--card);box-shadow:var(--shadow);padding:5px 12px 5px 8px;font-weight:700;font-size:13.5px;color:var(--ink)}
.hbtn{border:0;background:var(--card);box-shadow:var(--shadow);width:32px;height:32px;color:var(--acc)}
/* Navigation unten */
.tabs{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;border-radius:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:2px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line);justify-content:center}
.tabs button{max-width:150px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 4px;font-size:11.5px;font-weight:700;color:var(--mute);border-radius:12px;background:none!important;box-shadow:none!important}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--acc)}
.tabs button.on svg{stroke-width:2.3}
.tabs .ic{position:relative;display:block;padding:3px 16px;border-radius:999px;line-height:0}
.tabs button.on .ic{background:var(--accs)}
.tabs sup{position:absolute;top:-4px;right:2px;margin:0;min-width:17px;height:17px;line-height:17px;padding:0 4px;font-size:10.5px;font-weight:800;text-align:center;border-radius:999px;box-shadow:0 0 0 2px var(--card)}
@media (max-width:440px){.tabs button{font-size:10.5px}.tabs .ic{padding:3px 10px}}
/* Flächen */
.box{border:0;border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-top:12px}
.pbox{position:relative;overflow:hidden;padding-left:20px}
.pbox::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--pc,var(--acc))}
.box.overdue{box-shadow:inset 0 0 0 1.5px var(--red),var(--shadow)}
.banner{border-radius:16px;background:var(--accs)}
/* Chips & Segmente */
.chips{padding:4px 0 6px;gap:8px}
.chip{border:0;background:var(--card);box-shadow:var(--shadow);padding:7px 14px;font-weight:700;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);box-shadow:none}
.seg{background:var(--chip);border-radius:14px;padding:4px}
.seg button{border-radius:10px;padding:7px 14px;font-weight:700}
.seg button.on{box-shadow:var(--shadow)}
/* Buttons */
.btn{border:0;background:var(--chip);border-radius:12px;padding:9px 15px;font-weight:700;color:var(--ink)}
.btn.pri{background:var(--acc);color:#fff}
.btn.pri:active{background:var(--acc2)}
.btn.del{background:transparent;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--red) 45%,transparent);color:var(--red)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:6px 12px;border-radius:10px;font-size:13.5px}
.btn.wide{padding:13px;border-radius:14px;font-size:16px}
.btn:disabled{opacity:.45}
.link{color:var(--acc);font-weight:700}
.icon{color:var(--mute);font-size:22px}
/* Kalender mit Ringen */
.cal th{font-size:11.5px;font-weight:700;color:var(--mute)}
.cal td{padding:4px 0;font-size:14.5px;font-weight:600}
.cal tr.wk.sel td{background:var(--accs)}
.cal tr.wk.sel td:first-child{border-radius:14px 0 0 14px}.cal tr.wk.sel td:last-child{border-radius:0 14px 14px 0}
.cal td.out{color:var(--grey)}
.cal td.today span{outline:none;background:var(--acc);color:#fff;border-radius:999px;padding:3px 7px}
.ring{display:block;margin:0 auto;width:34px;height:34px}
.ring text{font-size:11px;font-weight:800;fill:var(--ink);font-family:inherit}
.ring.future text{fill:var(--mute)}
.kdots{gap:3px;margin-top:2px}
.kdots i{width:6px;height:6px}
.kw{border-radius:999px;background:transparent}
.legend{font-size:12.5px;margin-top:10px}
/* Aufgaben */
.ph{gap:10px;margin-bottom:8px}
.ph .dot{width:12px;height:12px}
.badge{font-size:11.5px;padding:3px 10px;font-weight:800}
.badge.open{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.badge.done{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.badge.future{background:var(--chip);color:var(--mute)}
.task{border-top:1px solid var(--line);padding:12px 0}
.task:first-of-type{border-top:0}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--grey);font-size:15px;font-weight:900;transition:background .15s,border-color .15s}
.chk.on{background:var(--green);border-color:var(--green)}
.days{gap:6px;margin-left:40px}
.days button{width:36px;height:32px;border-radius:999px;border:1.5px solid var(--grey);font-weight:700}
.days button.on{background:var(--green);border-color:var(--green)}
.sub,details{margin-left:40px}
summary{font-weight:700}
.tag{border-radius:999px;padding:3px 9px;font-weight:700}
.done-t{text-decoration-thickness:1.5px}
/* Formulare */
label.f{font-weight:700;color:var(--mute);font-size:13px}
.inp{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px}
.inp:focus{outline:none;border-color:var(--acc);background:var(--card)}
input[type=checkbox],input[type=radio]{accent-color:var(--acc);width:18px;height:18px;flex:none;margin-top:2px}
/* Bilanz */
.bar .tr{height:12px;border-radius:999px}
.bar .tr b{border-radius:999px}
.kpi{border:0;border-radius:16px;box-shadow:var(--shadow)}
table.hist th{font-size:12.5px;color:var(--mute);font-weight:700}
.code{font-weight:800;color:var(--acc)}
/* Dialoge, Toast, Führung */
.dlg{border-radius:24px;padding:22px}
.dlg h3{font-size:18px}

/* Version und Migration */
function migrate(){
 const P=normalize(JSON.parse(JSON.stringify(plan))),upd={dataVersion:DATA_VERSION,people:P.people,tasks:P.tasks.map(stripTask),pools:P.pools};
 if(!plan.frozen)upd.frozen={};
 if(!plan.memberInfo)upd.memberInfo={[user.uid]:user.email||''};
 H().update(JSON.parse(JSON.stringify(upd))).then(()=>logEntry('Datenstand aktualisiert','Version '+DATA_VERSION,'automatisch beim Update der Seite')).catch(e=>console.error(e));
}

async function checkVersion(){
 try{const r=await fetch(location.href.split('#')[0].split('?')[0]+'?v='+Date.now(),{cache:'no-store'});const t=await r.text();const m=t.match(/APP_VERSION='([^']+)'/);
  if(m&&m[1]!==APP_VERSION&&m[1]!==newVer){newVer=m[1];if(mode==='app')softRender()}}catch(e){}
}

 if(gateActive()&&GATED_ACTS.test(act)){pendingLog.push({act,what:what||'',detail:detail||''});return}const by=me&&person(me)?person(me).name:'';
 H().collection('log').add({ts:Date.now(),d:new Date().toISOString(),by,act,what:what||'',detail:detail||''}).catch(e=>console.error(e));

function taskSummary(t){return t.min+' Min, '+(t.mode==='flex'?'bei Bedarf':(IV[t.iv]||IV.weekly).label+(daysTxt(t)?' ('+daysTxt(t)+')':''))+', '+modeLabel(t)+(+t.wage>0?', '+eur(t.wage)+'/Std':'')}
function modeLabel(t){if(t.mode==='flex')return 'bei Bedarf ('+partsLabel(t)+')'+(t.fair==='none'?', zählt nicht':'');if(t.mode==='fix')return 'fest: '+partsLabel(t)+(t.fair==='none'?', zählt nicht':'');return partsLabel(t)+', '+FAIR_LABEL[t.fair]}
function taskDiff(a,b){
 const d=[],who=t=>t.person&&person(t.person)?person(t.person).name:'Pool';
 if(a.name!==b.name)d.push('Name: '+a.name+' → '+b.name);
 if(+a.min!==+b.min)d.push('Dauer: '+a.min+' → '+b.min+' Min');
 if(a.iv!==b.iv&&a.mode!=='flex'&&b.mode!=='flex')d.push('Intervall: '+(IV[a.iv]||IV.weekly).label+' → '+(IV[b.iv]||IV.weekly).label);
 if(daysTxt(a)!==daysTxt(b))d.push('Tage: '+(daysTxt(a)||'beliebig')+' → '+(daysTxt(b)||'beliebig'));
 if(modeLabel(a)!==modeLabel(b))d.push('Zuständig: '+modeLabel(a)+' → '+modeLabel(b));
 if((+a.wage||0)!==(+b.wage||0))d.push('Stundenlohn: '+eur(a.wage)+' → '+eur(b.wage));
 if(JSON.stringify(a.steps||[])!==JSON.stringify(b.steps||[]))d.push('Schritte geändert ('+(a.steps||[]).length+' → '+(b.steps||[]).length+')');
 return d.join('; ');
}
function fmtTs(ts){const d=new Date(ts);return d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear()+', '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}

function earningsList(){const out=[];Object.values(checks).forEach(doc=>Object.values(doc||{}).forEach(v=>{if(v&&typeof v==='object'&&v.p&&+v.e>0)out.push(v)}));return out}
function balance(pid){let b=0;earningsList().forEach(v=>{if((v.ep||v.p)===pid)b+=+v.e;if(v.payer===pid)b-=+v.e});payouts.forEach(x=>{if(x.p===pid)b-=+x.amount});return b}
function periodKeys(){
 const now=new Date(),keys=[];
 if(period==='week'){let m=mondayOf(now);for(let k=11;k>=0;k--){const d=new Date(m.getFullYear(),m.getMonth(),m.getDate()-7*k);keys.push({k:iso(d),l:'KW'+isoWeek(d)})}}
 else if(period==='month'){for(let k=11;k>=0;k--){const d=new Date(now.getFullYear(),now.getMonth()-k,1);keys.push({k:iso(d).slice(0,7),l:MONTHS[d.getMonth()].slice(0,3)})}}
 else{for(let k=4;k>=0;k--){const y=now.getFullYear()-k;keys.push({k:String(y),l:String(y)})}}
 return keys;
}
function keyOf(t){if(!t)return '';if(period==='week')return iso(mondayOf(parseD(t)));if(period==='month')return t.slice(0,7);return t.slice(0,4)}
function chartSvg(keys,data,ids){
 const W=340,Hh=170,pl=34,pb=22,pt=8,cw=(W-pl-6)/keys.length,bw=Math.max(6,cw*0.62);
 const tots=keys.map(k=>ids.reduce((s,id)=>s+((data[k.k]||{})[id]||0),0)),max=Math.max(1,...tots);
 const step=[1,2,5,10,20,25,50,100,200,250,500,1000].find(s=>max/s<=4)||Math.ceil(max/4);const top=Math.ceil(max/step)*step;
 let g='';for(let v=0;v<=top+1e-9;v+=step){const y=pt+(Hh-pt-pb)*(1-v/top);g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-4}" y="${y+3}" text-anchor="end">${v} €</text>`}
 keys.forEach((k,i)=>{let y0=Hh-pb;const x=pl+i*cw+(cw-bw)/2;
  ids.forEach(id=>{const v=(data[k.k]||{})[id]||0;if(!v)return;const h=(Hh-pt-pb)*v/top;y0-=h;g+=`<rect x="${x}" y="${y0}" width="${bw}" height="${h}" rx="2" fill="${pcol(id)}"><title>${esc(pname(id))}: ${eur(v)}</title></rect>`});
  g+=`<text x="${x+bw/2}" y="${Hh-6}" text-anchor="middle">${esc(k.l)}</text>`});
 return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Verdienst je Zeitraum">${g}</svg>`;
}

 h+=`<div class="box">`+wal.map(p=>{const b=balance(p.id);return `<div class="ti"><span class="dot" style="background:${p.color}"></span><b class="sp">${esc(p.name)}</b><span class="money ${b<0?'neg':''}">${eur(b)}</span><button class="btn sm" data-a="payout" data-v="${p.id}">Auszahlen</button></div>`}).join('')+(wal.length?'':'<div class="muted small">Kein Geldkonto aktiv.</div>')+`</div>`;
 const keys=periodKeys(),data={},ids=[];
 el.forEach(v=>{const k=keyOf(v.t);const ep=v.ep||v.p;(data[k]=data[k]||{})[ep]=((data[k]||{})[ep]||0)+(+v.e);if(!ids.includes(ep))ids.push(ep)});
 ids.sort((a,b)=>plan.people.findIndex(p=>p.id===a)-plan.people.findIndex(p=>p.id===b));
 const sum={};keys.forEach(k=>ids.forEach(id=>{sum[id]=(sum[id]||0)+((data[k.k]||{})[id]||0)}));
 h+=`<h2>Verdienst</h2><div class="box"><div class="seg">${[['week','Wöchentlich'],['month','Monatlich'],['year','Jährlich']].map(([k,l])=>`<button data-a="period" data-v="${k}" class="${period===k?'on':''}">${l}</button>`).join('')}</div>`;
 if(!ids.length)h+=`<div class="muted small" style="margin-top:10px">Noch nichts verdient. Sobald jemand mit Geldkonto eine bezahlte Aufgabe abhakt, erscheint hier die Grafik.</div>`;
 else{h+=chartSvg(keys,data,ids);h+=`<div class="legend">${ids.map(id=>`<span><i class="dot" style="background:${pcol(id)}"></i>${esc(pname(id))}: ${eur(sum[id])}</span>`).join('')}</div><div class="muted small" style="margin-top:6px">Summe im angezeigten Zeitraum (${period==='week'?'12 Wochen':period==='month'?'12 Monate':'5 Jahre'}).</div>`}
 h+=`</div>`;
 const pays=payouts.slice().sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,10);
 if(pays.length)h+=`<h2>Auszahlungen</h2><div class="box">`+pays.map(x=>`<div class="ti"><span class="dot" style="background:${pcol(x.p)}"></span><span class="sp">${esc(person(x.p)?person(x.p).name:x.pn)}</span><span class="muted small">${esc(x.date.split('-').reverse().join('.'))}</span><span class="money">${eur(x.amount)}</span></div>`).join('')+`</div>`;
 return h;
}

async function importBackup(file){

  if(!await uiConfirm('Sicherung vom '+String(d.exported).slice(0,10)+' einspielen?\n\nAufgaben, Personen und Planstart werden ersetzt. Häkchen und Auszahlungen aus der Sicherung werden ergänzt.','Einspielen',true))return;
  const hh=d.household,N=normalize({people:hh.people||[],tasks:hh.tasks||[],pools:hh.pools}),upd={name:hh.name||plan.name,start:hh.start||plan.start,people:N.people,tasks:N.tasks,pools:N.pools,over:hh.over||{},dataVersion:DATA_VERSION};

  const ops=[];Object.entries(d.checks||{}).forEach(([id,v])=>ops.push(b=>b.set(H().collection('checks').doc(id),v,{merge:true})));
  (d.payouts||[]).forEach(x=>ops.push(b=>b.set(H().collection('payouts').doc('imp'+(x.ts||rid())+'_'+x.p),x)));
  for(let i=0;i<ops.length;i+=400){const b=db.batch();ops.slice(i,i+400).forEach(f=>f(b));await b.commit()}
  logEntry('Sicherung eingespielt',String(d.exported).slice(0,10),'');toast('Sicherung eingespielt');
 }catch(e){fail(e)}finally{const f=$('#importFile');if(f)f.value=''}
}

function icsEsc(t){return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
function icsFold(line){const enc=new TextEncoder();if(enc.encode(line).length<=74)return line;let out='',cur='',n=0;for(const ch of line){const b=enc.encode(ch).length;if(n+b>73){out+=cur+'\r\n ';cur='';n=1}cur+=ch;n+=b}return out+cur}

 const c=calCfg,nw=Math.max(0,nowWeek()),now=new Date(),stamp=now.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Fairloop//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+icsEsc('Fairloop – '+(plan.name||''))];
 let n=0;
 for(let i=nw;i<nw+c.weeks;i++){

   const daily=isMulti(x.t),dd=tDays(x.t);if(x.t.iv==='daily'&&!c.daily)return;
   const days=daily?dd:(dd.length?dd:[c.day]);
   days.forEach(k=>{

async function timerDiscard(){const x=myTimer();if(!x)return;if(!await uiConfirm('Die Messung für „'+x.n+'“ verwerfen? Die Aufgabe bleibt offen.','Verwerfen',true))return;timerClear()}
async function timerStop(){
 const x=myTimer();if(!x)return;
 if(x.since){const acc=tmrMs(x);Object.assign(x,{acc,since:0});TDoc().update({acc,since:0}).catch(fail);render()}
 const t=plan.tasks.find(y=>y.id===x.ti);
 if(!t){await uiAlert('Die Aufgabe „'+x.n+'“ gibt es nicht mehr. Die Messung wird verworfen.');timerClear();return}
 const m=Math.max(1,Math.round(x.acc/60000));
 const c=await dlgShow({title:'Timer gestoppt',text:'„'+t.name+'“: gemessen '+fmtClock(x.acc)+' ('+m+' Min), geplant '+t.min+' Min.'+(x.acc>3*3600e3?'\n\nDer Timer lief über 3 Stunden. Bitte die Zeit prüfen.':'')+'\n\nWas möchtest du tun?',choices:[{v:'take',l:'✓ Gemessene Zeit übernehmen – '+m+' Min'},{v:'manual',l:'✎ Zeit manuell eingeben'},{v:'abort',l:'✕ Zeiterfassung abbrechen'}],cancel:'Zurück, Timer pausiert lassen'});
 if(!c){toast('Timer pausiert – fortsetzen oder später stoppen');return}
 if(c==='abort'){if(await dlgShow({title:'Zeiterfassung abbrechen?',text:'Die Messung für „'+t.name+'“ wird gelöscht, die Aufgabe bleibt offen.',ok:'Messung löschen',cancel:'Zurück',danger:true})){timerClear();toast('Zeiterfassung abgebrochen')}return}
 let dur=m;
 if(c==='manual'){
  const v=await dlgShow({title:'Zeit manuell eingeben',text:'Wie viele Minuten hast du für „'+t.name+'“ gebraucht? Gemessen: '+m+' Min, geplant: '+t.min+' Min.',input:String(m),inputType:'number',ok:'Weiter zum Abhaken',cancel:'Zurück'});
  if(v===null||v===false){toast('Timer pausiert – fortsetzen oder später stoppen');return}
  const n=Math.round(+String(v).replace(',','.'));if(!(n>0)){await uiAlert('Bitte eine Zahl größer als 0 eingeben.');return}
  dur=Math.min(1440,n);
 }
 let ok=false;
 if(x.flex)ok=await flexDo(t,dur);
 else{const i=widIdx(x.w);if(rec(i,x.k)){await uiAlert('„'+t.name+'“ wurde inzwischen schon abgehakt. Die Messung wird verworfen.');timerClear();return}ok=await checkFlow(i,t,x.p,x.k,dur)}
 if(ok)timerClear();
}
setInterval(()=>{const x=plan&&myTimer();if(!x||!x.since)return;const s=fmtClock(tmrMs(x));document.querySelectorAll('[data-tmr]').forEach(e=>{if(e.textContent!==s)e.textContent=s})},1000);

/* Gemessene Zeiten */
function median(a){if(!a.length)return 0;const b=a.slice().sort((x,y)=>x-y),m=Math.floor(b.length/2);return b.length%2?b[m]:(b[m-1]+b[m])/2}
function roundSug(x){return x>=20?Math.max(5,Math.round(x/5)*5):Math.max(1,Math.round(x))}
function measData(per){
 const M={},mk=iso(new Date()).slice(0,7);
 Object.values(checks).forEach(doc=>Object.values(doc||{}).forEach(v=>{
  if(!v||typeof v!=='object'||!(+v.dur>0)||!v.ti)return;if(per==='month'&&String(v.t||'').slice(0,7)!==mk)return;
  const who=v.by||v.p,r=M[v.ti]=M[v.ti]||{all:[],by:{}};r.all.push(+v.dur);(r.by[who]=r.by[who]||[]).push(+v.dur);
 }));
 return M;
}
function measStat(id){const r=measData('all')[id];if(!r)return{n:0};const med=median(r.all);return{n:r.all.length,med:Math.round(med),sug:roundSug(med)}}
function measRows(){
 const M=measData(msPer);
 return Object.entries(M).map(([id,r])=>{const t=plan.tasks.find(x=>x.id===id);if(!t)return null;const med=median(r.all),sug=roundSug(med),dev=t.min?(med-t.min)/t.min:0;
  return{id,t,n:r.all.length,med,sug,dev,by:r.by,cand:r.all.length>=3&&sug!==t.min}}).filter(Boolean).sort((a,b)=>Math.abs(b.dev)-Math.abs(a.dev));
}
function viewMeasured(){
 const rows=measRows(),nc=rows.filter(r=>r.cand).length;
 let h=`<h2>Gemessene Zeiten</h2><div class="box"><div class="seg" style="margin:0 0 10px"><button data-a="msPer" data-v="month" class="${msPer==='month'?'on':''}">Laufender Monat</button><button data-a="msPer" data-v="all" class="${msPer==='all'?'on':''}">Gesamt</button></div>`;
 if(!rows.length)return h+`<div class="muted small">Noch keine Messungen${msPer==='month'?' in diesem Monat':''}. Starte im Plan bei einer Aufgabe den Timer mit ▶ und stoppe ihn, wenn du fertig bist.</div></div>`;
 rows.forEach(r=>{const p=Math.round(r.dev*100),c=Math.abs(p)<=10?'g':Math.abs(p)<=25?'o':'r',per=Object.entries(r.by).map(([id,a])=>esc(pname(id))+' '+Math.round(median(a))+' Min'+(a.length>1?' ('+a.length+'×)':'')).join(' · ');
  h+=`<div class="ti" style="align-items:flex-start"><div class="sp"><div class="row" style="gap:8px"><b class="sp">${esc(r.t.name)}</b><span class="dv ${c}">${p>0?'+':''}${p} %</span></div><div class="small">geplant ${r.t.min} Min · gemessen ${Math.round(r.med)} Min <span class="muted">(${r.n}×)</span></div>${Object.keys(r.by).length>1?`<div class="muted small">${per}</div>`:''}${r.cand?`<button class="btn sm" style="margin-top:6px" data-a="msAdopt" data-v="${r.id}">${r.sug} Min als Dauer übernehmen</button>`:r.n<3&&r.sug!==r.t.min?`<div class="muted small">Vorschlag ab 3 Messungen</div>`:''}</div></div>`});
 if(nc>1)h+=`<div style="margin-top:10px"><button class="btn pri sm" data-a="msAdoptAll">Alle ${nc} Vorschläge übernehmen</button></div>`;
 return h+`</div><p class="muted small">Gemessen wird mit dem Timer im Plan. Gezeigt wird der Median, damit einzelne Ausreißer – etwa ein vergessener Timer – nicht ins Gewicht fallen. Vorschläge gibt es ab 3 Messungen, gerundet auf 5 Minuten. Gutschrift, Fairness und Lohn richten sich nach der geplanten Dauer, bis du eine gemessene Zeit übernimmst.</p>`;
}
async function offerAdopt(t,dur){
 if(!t||!dur)return;const cur=plan.tasks.find(x=>x.id===t.id);if(!cur||cur.min===dur)return;
 const s=measStat(t.id),ch=[{v:'d',l:'Ja, '+dur+' Min übernehmen'}];
 if(s.n>=3&&s.sug!==dur&&s.sug!==cur.min)ch.push({v:'m',l:'Ja, Median aller Messungen: '+s.sug+' Min'});
 const v=await dlgShow({title:'Gemessene Zeit übernehmen?',text:'„'+cur.name+'“ ist mit '+cur.min+' Min geplant, gemessen wurden '+dur+' Min'+(s.n>1?' (Median aus '+s.n+' Messungen: '+s.med+' Min)':'')+'.\n\nSoll die gemessene Zeit die neue Dauer der Aufgabe werden? Das ändert die Verteilung, den Lohn und die Fairness.',choices:ch,cancel:'Nein, '+cur.min+' Min lassen'});
 if(!v)return;
 await adoptMins([v==='m'?{id:t.id,min:s.sug,n:s.n}:{id:t.id,min:dur}]);
}
async function adoptMins(list){
 list=list.filter(x=>{const t=plan.tasks.find(y=>y.id===x.id);return t&&x.min>0&&x.min!==t.min});
 if(!list.length)return;
 const t0=plan.tasks.find(y=>y.id===list[0].id);
 if(!await chooseEff(list.length===1?'Die neue Dauer für „'+t0.name+'“':'Die neuen Dauern für '+list.length+' Aufgaben'))return;
 list.forEach(x=>{const k=plan.tasks.findIndex(y=>y.id===x.id),t=plan.tasks[k];logEntry('Dauer aus Messung übernommen',t.name,t.min+' → '+x.min+' Min'+(x.n?' (Median aus '+x.n+' Messungen)':' (gemessen)'));plan.tasks[k]=normTask(Object.assign(stripTask(t),{min:x.min}),plan)});
 savePlan();okToast(list.length===1?'Neue Dauer: '+list[0].min+' Min':list.length+' Dauern übernommen');
}

async function deleteAccount(){
 if(!user)return;
 const last=!!(plan&&(plan.members||[]).length<=1);
 const pw=await dlgShow({title:'Konto endgültig löschen',text:'Dein Konto ('+user.email+') wird gelöscht.'+(plan?(last?' Du bist das letzte Konto in diesem Haushalt. Deshalb werden auch alle Haushaltsdaten gelöscht: Aufgaben, Häkchen, Tausche, Geldkonten und Verlauf.':' Der Haushalt bleibt für die anderen erhalten.'):'')+'\n\nZur Bestätigung bitte dein Passwort eingeben.',input:'',inputType:'password',ok:'Endgültig löschen',cancel:'Abbrechen',danger:true});
 if(!pw)return;
 try{
  await user.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(user.email,pw));
  stopAll();
  if(hid){
   const ref=H();
   if(last){
    for(const c of ['checks','swaps','payouts','log']){const docs=(await ref.collection(c).get()).docs;for(let i=0;i<docs.length;i+=400){const b=db.batch();docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}}
    if(plan&&plan.code)await db.collection('codes').doc(plan.code).delete().catch(()=>{});
    await ref.delete();
   }else await ref.update({members:FV.arrayRemove(user.uid),['memberInfo.'+user.uid]:FV.delete()});
  }
  await db.collection('users').doc(user.uid).delete();
  await user.delete();
  uiAlert('Dein Konto wurde gelöscht.');
 }catch(e){
  console.error(e);
  if(e&&(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential'))uiAlert('Das Passwort stimmt nicht. Es wurde nichts gelöscht.');
  else{uiAlert('Löschen fehlgeschlagen: '+(e&&e.message||e)+'\nBitte lade die Seite neu und versuche es erneut.','Fehler')}
 }
}

/* Admin-Freigabe */
const GATED_ACTS=/^(Aufgabe |Person |Geldkonto |Planstart|Abwesenheit |Gruppe |Funktion)/;
const PLAN_KEYS=['name','people','tasks','pools','start','features'];
const KEY_LABEL={features:'Funktionen',name:'Haushaltsname',people:'Personen',tasks:'Aufgaben',pools:'Gruppen',start:'Planstart'};
function adminOn(){return !!(plan&&F('admin')&&plan.admin&&plan.admin.on)}
function adminName(){return adminOn()?pname(plan.admin.person):''}
function gateActive(){return adminOn()&&!adminUnlocked}
function okToast(m){if(!gateActive())toast(m)}
function hashStr(t){let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return (h>>>0).toString(36)}
async function pinHash(pin,salt){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function proposeChange(){
 const changed={},base={};
 PLAN_KEYS.forEach(k=>{if(JSON.stringify(plan[k])!==JSON.stringify(serverPlan[k])){changed[k]=JSON.parse(JSON.stringify(plan[k]));base[k]=hashStr(JSON.stringify(serverPlan[k]))}});
 const summary=pendingLog.splice(0);
 plan=normalize(JSON.parse(JSON.stringify(serverPlan)));assignCache=null;edit=null;poolEdit=null;awayFor=null;
 if(!Object.keys(changed).length){render();return}
 if(!summary.length)summary.push({act:'Einstellung geändert',what:Object.keys(changed).map(k=>KEY_LABEL[k]).join(', '),detail:''});
 render();
 const eff=effPending;effPending=null;
 H().collection('proposals').add({ts:Date.now(),by:me&&person(me)?person(me).name:'',status:'open',summary,data:changed,base,eff:eff==null?null:wid(eff)}).then(()=>toast('Als Vorschlag an '+adminName()+' gesendet')).catch(fail);
}
async function ensureAdmin(){
 if(!adminOn())return true;if(adminUnlocked)return true;
 const ap=person(plan.admin.person);
 if(ap&&ap.uid){if(ap.uid===user.uid){adminUnlocked=true;render();toast('Als Admin entsperrt');return true}uiAlert('Nur '+ap.name+' kann mit dem eigenen Konto als Admin handeln.');return false}
 const pin=await dlgShow({title:'Admin-PIN',text:'Bitte die PIN von '+adminName()+' eingeben.',input:'',inputType:'password',ok:'Entsperren',cancel:'Abbrechen'});
 if(!pin)return false;
 if(await pinHash(pin,plan.admin.salt)!==plan.admin.hash){uiAlert('Die PIN stimmt nicht.');return false}
 adminUnlocked=true;render();toast('Als Admin entsperrt');return true;
}

 if(!p1)return;if(!/^\d{4,8}$/.test(p1)){uiAlert('Die PIN muss aus 4 bis 8 Ziffern bestehen.');return}

async function approveProposal(p){
 if(!await ensureAdmin())return;
 const conflicts=Object.keys(p.data||{}).filter(k=>p.base&&p.base[k]&&p.base[k]!==hashStr(JSON.stringify(serverPlan[k])));
 if(conflicts.length&&!await uiConfirm('Seit diesem Vorschlag wurden '+conflicts.map(k=>KEY_LABEL[k]).join(', ')+' schon anderweitig geändert. Beim Freigeben werden diese neueren Änderungen in diesem Bereich überschrieben.','Trotzdem freigeben',true))return;
 try{
  if(p.eff){applyEffective(Math.max(nowWeek(),widIdx(p.eff)))}else ensureFrozen();
  await H().update(JSON.parse(JSON.stringify(p.data)));
  const b=db.batch(),now=Date.now();(p.summary||[]).forEach((x,i)=>b.set(H().collection('log').doc(),{ts:now+i,d:new Date().toISOString(),by:p.by||'',act:x.act,what:x.what,detail:(x.detail?x.detail+' · ':'')+'freigegeben von '+adminName()}));
  b.update(H().collection('proposals').doc(p.id),{status:'approved',decided:now});await b.commit();
  toast('Freigegeben');
 }catch(e){fail(e)}
}

function termsDiff(a,b){

async function confirmTwice(title,rows){

async function finalCheck(i,t,p,k,doer,gift,dur){
 const d=doer&&person(doer)?doer:p,dk=k.split('_')[1],rows=[['Woche','KW '+isoWeek(weekMon(i))+(dk!==undefined?', '+['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'][+dk]:'')],['Erledigt von',pname(d)]];
 if(d!==p)rows.push(['Eingeplant für',pname(p)]);
 if(me&&me!==d)rows.push(['Eingetragen von',pname(me)]);
 if(gift)rows.push(['Geschenkt',GIFT_LABEL[gift].replace(' geschenkt','')]);
 rows.push(['Dauer',t.min+' Min'+(dur?' (gutgeschrieben)':'')]);if(dur)rows.push(['Gemessen',dur+' Min']);
 const mt=gift==='money'||gift==='both'?p:d;if(F('money')&&+t.wage>0&&person(mt)&&person(mt).wallet)rows.push(['Lohn',eur(t.min/60*t.wage)+' für '+pname(mt)]);

   const paid=F('money')&&+t.wage>0&&person(p)&&person(p).wallet,opts=[{v:'none',l:'Nichts schenken – '+pname(d)+' bekommt Zeit'+(paid&&person(d).wallet?' und Lohn':'')+' gutgeschrieben'},{v:'time',l:'Zeit schenken – zählt für '+pname(p)+', kein Ausgleich später'}];
   if(paid){opts.push({v:'money',l:'Lohn schenken – '+eur(t.min/60*t.wage)+' gehen an '+pname(p)});opts.push({v:'both',l:'Zeit und Lohn schenken'})}

function featureInUse(k){

 if(k==='money'){const n=plan.people.filter(p=>Math.abs(balance(p.id))>0.004).length;return n?n+' Geldkonto/-konten mit Guthaben':''}
 if(k==='away'){const t=iso(new Date());const n=plan.people.filter(p=>(p.away||[]).some(a=>a.t>=t)).length;return n?'eingetragene Abwesenheiten':''}
 if(k==='groups'){return plan.pools.length>1||plan.pools.some(q=>Object.values(q.w||{}).some(w=>w!==1&&w!==q.def))||plan.tasks.some(t=>t.who&&t.who.length)?'Gruppen, Anteile oder Teilnehmer-Einschränkungen':''}

 plan.features=Object.assign({},plan.features,{[k]:on});assignCache=null;

async function applyPreset(k){

function effLabel(E){const m=weekMon(E);return 'KW '+isoWeek(m)+' (ab Mo '+fmtDate(m)+m.getFullYear()+')'}
async function chooseEff(what){
 const nw=Math.max(0,nowWeek()),now=new Date(),nm=new Date(now.getFullYear(),now.getMonth()+1,1);
 let mFirst=mondayOf(nm);if(mFirst<nm)mFirst=new Date(mFirst.getFullYear(),mFirst.getMonth(),mFirst.getDate()+7);
 const Emonth=Math.max(nw+1,weekIdx(mFirst));
 const v=await dlgShow({title:'Ab wann soll das gelten?',text:what+' betrifft die Verteilung. Bereits abgehakte Aufgaben bleiben in jedem Fall unverändert.',choices:[
  {v:'now',l:'Sofort – ab dieser Woche (KW '+isoWeek(weekMon(nw))+')'},
  {v:'next',l:'Ab nächster Woche – '+effLabel(nw+1)},
  {v:'month',l:'Ab nächstem Monat – '+effLabel(Emonth)},
  {v:'date',l:'Ab einem bestimmten Tag …'}],cancel:'Abbrechen'});
 if(!v)return false;
 let E=v==='now'?nw:v==='next'?nw+1:v==='month'?Emonth:null;
 if(v==='date'){
  const d=await dlgShow({title:'Ab welchem Tag?',text:'Fairloop plant in Wochen. Die Änderung gilt ab der Woche, in die der gewählte Tag fällt.',input:iso(new Date(now.getTime()+7*DAY)),inputType:'date',ok:'Übernehmen',cancel:'Abbrechen'});
  if(!d)return false;E=Math.max(nw,weekIdx(parseD(d)));
 }
 effPending=E;if(!gateActive())applyEffective(E);
 return true;
}
function applyEffective(E){
 ensureFrozen();
 const nw=Math.max(0,nowWeek()),f=plan.frozen||{},FP=firebase.firestore.FieldPath,args=[],nf=Object.assign({},f);
 Object.keys(f).forEach(w=>{const i=widIdx(w);if(i>=nw&&i>=E){args.push(new FP('frozen',w),FV.delete());delete nf[w]}});
 for(let i=nw;i<E&&i<nw+104;i++){const w=wid(i);if(!nf[w]){const a=assign(i).map(x=>({i:x.t.id,p:x.p,n:x.t.name,m:x.t.min,v:x.t.iv,d:x.t.days||[],q:x.q||'fix'}));nf[w]=a;args.push(new FP('frozen',w),a)}}
 plan.frozen=nf;assignCache=null;
 if(args.length)H().update(...args).catch(e=>console.error(e));
}

 if(!open.length)h+=`<div class="muted small">Alles erledigt, die Liste ist leer.</div>`;
 h+=open.map(x=>`<div class="sitem"><button class="chk" data-a="shopBuy" data-v="${x.id}" aria-label="${esc(x.text)} gekauft"></button><div class="txt">${esc(x.text)}<div class="meta">von ${esc(person(x.by)?pname(x.by):x.byn||'')} · ${fmtTs(x.ts).split(',')[0]}</div></div>${x.by===me?`<button class="icon" data-a="shopDel" data-v="${x.id}" aria-label="Entfernen">✕</button>`:''}</div>`).join('')+`</div>`;
 if(done.length)h+=`<h2>Zuletzt gekauft</h2><div class="box">`+done.map(x=>`<div class="sitem bought"><span class="chk on" aria-hidden="true">✓</span><div class="txt">${esc(x.text)}<div class="meta">gekauft von ${esc(person(x.boughtBy)?pname(x.boughtBy):x.boughtByn||'')} · ${fmtTs(x.boughtAt)}</div></div><button class="btn sm" data-a="shopAgain" data-v="${x.id}">Nochmal</button></div>`).join('')+`</div>`;
 return h;
}
async function shopAdd(){
 if(!me){askMe();return}const i=$('#shopIn'),t=i?i.value.trim():'';if(!t)return;
 const dup=shop.find(x=>x.status==='open'&&x.text.toLowerCase()===t.toLowerCase());if(dup){uiAlert('„'+dup.text+'“ steht schon auf der Liste.');return}
 if(i)i.value='';
 try{await H().collection('shop').add({text:t,by:me,byn:pname(me),ts:Date.now(),status:'open'});const j=$('#shopIn');if(j)j.focus()}catch(e){fail(e)}
}
async function shopBuy(it){
 if(!me){askMe();return}
 const a=await dlgShow({title:'„'+it.text+'“ gekauft?',text:'Gekauft von: '+pname(me)+'\nEingetragen von: '+(person(it.by)?pname(it.by):it.byn||''),ok:'Weiter',cancel:'Abbrechen'});if(!a)return;
 const b=await dlgShow({title:'Endgültig bestätigen',text:'„'+it.text+'“ wird als gekauft gespeichert. Das lässt sich nicht rückgängig machen. Über „Nochmal“ kannst du den Artikel später wieder auf die Liste setzen.',ok:'Endgültig: gekauft',cancel:'Abbrechen',danger:true});if(!b)return;
 try{await H().collection('shop').doc(it.id).update({status:'bought',boughtBy:me,boughtByn:pname(me),boughtAt:Date.now()});toast('„'+it.text+'“ gekauft')}catch(e){fail(e)}
}

render();
</script>
</body>
</html>
